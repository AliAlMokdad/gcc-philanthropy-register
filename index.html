<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCC Philanthropy, Donors and Funders</title>
<meta name="description" content="Directory of philanthropic funders, foundations, corporate giving programmes and endowments in the United Arab Emirates, Saudi Arabia and Qatar.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231F4E3D'/></svg>">
<!--
ANTI_SLOP_BRIEF
  bold move:  the landing page is the dataset, not an introduction to it. The three
              country doors are sized in proportion to how many funders each holds,
              so the shape of Gulf philanthropy is the first thing seen and every
              element on the page is a way in. Tile SIZE is dampened (square root)
              for legibility; the BAR and the printed count and percentage carry the
              true figure, so nothing is visually overstated.
  type:       system serif for organisation, country and type names; system sans for
              chrome, figures and contact details. This is a reference register of
              institutions, closer to a directory than an app, and the serif says
              record rather than product. No web fonts, so nothing to download and
              no external request.
  colour:     one accent, #1F4E3D, taken from the header rows of the source
              spreadsheet, so the site and the workbook read as one deliverable.
              All sixteen foreground and background pairs were measured against
              WCAG AA; the lowest is 4.84:1.
  shape:      a SET of independent organisations, entered through two hierarchies
              (place, kind). So level 1 is two ranked lists and level 2 is a list of
              records, not a grid of cards, which would imply the rows are peers of
              each other rather than entries in a register.
  verifiable: every figure on the page is counted from data.json at run time, and
              that file is exported from the workbook. The page states no number it
              did not compute. Each record shows its real email address, phone
              number and domain as text, so a reader can check a contact without
              clicking and without trusting a label.
  absent by decision: hero paragraph, About, Contact form, testimonials, decorative
              icons, onboarding, sponsor logos, any generated commentary or insight.

  Every node is built with createElement and textContent. There is no innerHTML in
  this file, so no cell of the source data is ever parsed as markup.
-->
<style>
:root{
  --ink:#1A1A1A; --ink-2:#54545A; --ink-3:#6E6E76;
  --accent:#1F4E3D; --accent-soft:#E8F0ED; --accent-line:#C0D4CC;
  --paper:#FFFFFF; --paper-2:#FAFAF8; --line:#E3E3DF;
  --focus:#1F4E3D;
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#F2F2EF; --ink-2:#B8B8B4; --ink-3:#9A9A96;
    --accent:#8FD1B4; --accent-soft:#17241F; --accent-line:#335347;
    --paper:#121413; --paper-2:#1A1D1B; --line:#2A2D2B; --focus:#8FD1B4;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--paper);color:var(--accent);
      padding:10px 14px;z-index:9;border:1px solid var(--accent)}
.skip:focus{left:12px;top:12px}

header.top{border-bottom:1px solid var(--line);background:var(--paper-2)}
header.top .wrap{display:flex;align-items:baseline;gap:14px;
  flex-wrap:wrap;padding-top:16px;padding-bottom:16px}
h1{font:600 19px/1.2 var(--serif);margin:0;letter-spacing:.1px}
.count-strap{font:500 12px/1 var(--sans);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin:0}

.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px}
section.band{padding:34px 0}
section.band + section.band{border-top:1px solid var(--line)}

.doors{display:grid;gap:14px}
@media (min-width:720px){ .doors{grid-template-columns:var(--door-cols,1fr 1fr 1fr)} }
.door{
  display:block;text-decoration:none;color:inherit;background:var(--paper-2);
  border:1px solid var(--line);border-left:4px solid var(--accent);
  padding:20px 20px 17px;transition:background .15s ease,border-color .15s ease;
}
.door:hover,.door:focus-visible{background:var(--accent-soft);border-color:var(--accent-line)}
.door .n{display:block;font:600 40px/1 var(--sans);color:var(--accent);letter-spacing:-1.2px}
.door .nm{display:block;font:600 17px/1.25 var(--serif);margin:7px 0 13px;color:var(--ink)}
.door .go{display:block;font:600 12px/1 var(--sans);color:var(--ink-2);letter-spacing:.02em}

.bar{display:block;height:5px;background:var(--accent-soft);margin:0 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

ol.ranked{list-style:none;margin:0;padding:0;
  display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:720px){ ol.ranked{grid-template-columns:1fr 1fr} }
ol.ranked a{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;
  background:var(--paper);padding:11px 14px;text-decoration:none;color:inherit;
  height:100%;
}
ol.ranked a:hover,ol.ranked a:focus-visible{background:var(--accent-soft)}
ol.ranked .t{font:600 15px/1.3 var(--serif)}
ol.ranked .c{font:600 14px/1 var(--sans);color:var(--accent);
  font-variant-numeric:tabular-nums}
ol.ranked .bar{grid-column:1/-1;margin:5px 0 0}
details.more{margin-top:16px}
details.more summary{font:600 13px/1 var(--sans);color:var(--accent);cursor:pointer;
  padding:9px 0;width:max-content}
details.more ol.ranked{margin-top:10px}

.l2head{padding:22px 0 0}
.back{display:inline-block;font:600 13px/1 var(--sans);text-decoration:none;
  padding:8px 0;margin-bottom:8px}
.back:hover{text-decoration:underline}
h2.sel{font:600 26px/1.2 var(--serif);margin:2px 0 4px;letter-spacing:-.2px}
/* This heading is focused on every route change so a screen reader announces
   where it landed. It is tabindex="-1", so no keyboard user can reach it and a
   ring would only ever be a full-width box drawn by that programmatic focus. */
h2.sel:focus,h2.sel:focus-visible{outline:none}
.sel-sub{font:400 14px/1.4 var(--sans);color:var(--ink-2);margin:0 0 18px}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.search{flex:1 1 260px;display:flex}
.search input{
  width:100%;font:15px/1.2 var(--sans);color:var(--ink);background:var(--paper);
  border:1px solid var(--line);padding:11px 12px;border-radius:0;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--accent);outline:2px solid var(--focus);
  outline-offset:-1px}
fieldset.has{border:0;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap;
  align-items:center}
fieldset.has legend{float:left;font:600 11px/36px var(--sans);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:0 8px 0 0}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;font:600 13px/1 var(--sans);color:var(--ink-2);
  border:1px solid var(--line);padding:10px 12px;background:var(--paper);
  transition:background .12s ease,border-color .12s ease}
.chip input:hover + span{border-color:var(--accent-line)}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
@media (prefers-color-scheme:dark){ .chip input:checked + span{color:#0F1412} }
.chip input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}

.tally{font:500 13px/1 var(--sans);color:var(--ink-2);padding:14px 0 4px;
  font-variant-numeric:tabular-nums;margin:0}

ul.recs{list-style:none;margin:0;padding:0}
li.rec{padding:15px 0 16px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
/* Two scan paths, which is what the reviewers converged on: who they are on the
   left, how to reach them on the right. The contact block is plain text lines
   rather than bordered chips. Bordered chips were tried and, once rendered, they
   out-shouted the organisation name and pushed each row to about 140px. */
@media (min-width:800px){
  li.rec{grid-template-columns:minmax(0,1fr) 262px;gap:5px 32px;align-items:start;
    grid-template-areas:"nm contact" "meta contact" "focus contact" "btn contact" "who contact"}
  .rec .nm{grid-area:nm} .rec .meta{grid-area:meta} .rec .focus{grid-area:focus}
  .rec .expand{grid-area:btn} .rec .who{grid-area:who} .rec .routes{grid-area:contact}
}
.rec .nm{font:600 17px/1.3 var(--serif);margin:0;letter-spacing:.1px}
.rec .meta{font:400 13px/1.45 var(--sans);color:var(--ink-2);margin:0}
.rec .meta b{font-weight:600;color:var(--ink);font-size:12px;
  letter-spacing:.03em;text-transform:uppercase}
.rec .who{font:400 13px/1.45 var(--sans);color:var(--ink-2);margin:0}
.rec .focus{font:400 14px/1.5 var(--sans);color:var(--ink);margin:0;max-width:66ch}
.rec .focus.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.rec .expand{font:600 12px/1 var(--sans);color:var(--accent);background:none;
  border:0;padding:6px 0;cursor:pointer;text-align:left;justify-self:start}
.rec .expand:hover{text-decoration:underline}

/* the contact block carries the real values, so an address is readable without
   clicking. Padding keeps every target at least 24px high. */
.routes{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.routes .r{display:flex;align-items:baseline;gap:10px;min-width:0}
.routes a{font:500 13px/1.35 var(--sans);color:var(--accent);text-decoration:none;
  padding:4px 0;overflow-wrap:anywhere;min-width:0}
.routes a:hover,.routes a:focus-visible{text-decoration:underline}
/* padding, not font size, carries this to the 24px minimum target in WCAG 2.2.
   At 5px it measured 21px high, which axe does not flag but a thumb does. */
.routes .copy{font:600 11px/1 var(--sans);color:var(--ink-3);background:none;
  border:0;padding:7px 6px;cursor:pointer;flex:0 0 auto;letter-spacing:.06em;
  text-transform:uppercase;min-height:25px}
.routes .copy:hover{color:var(--accent);text-decoration:underline}
.routes .none{font:400 13px/1.35 var(--sans);color:var(--ink-3);padding:4px 0}

.loadmore{margin:22px 0 8px}
.loadmore button{font:600 14px/1 var(--sans);color:#FFFFFF;background:var(--accent);
  border:1px solid var(--accent);padding:13px 20px;cursor:pointer;width:100%}
@media (prefers-color-scheme:dark){ .loadmore button{color:#0F1412} }
@media (min-width:520px){ .loadmore button{width:auto;min-width:250px} }
.empty{padding:30px 0 40px;color:var(--ink-2);font-size:15px}
.empty button{font:600 13px/1 var(--sans);color:var(--accent);background:none;
  border:1px solid var(--accent-line);padding:9px 12px;cursor:pointer;margin-top:12px}

footer.foot{border-top:1px solid var(--line);margin-top:14px;padding:18px 0 34px}
footer.foot p{margin:0;font:400 12.5px/1.5 var(--sans);color:var(--ink-3)}

#state{padding:44px 0;font:400 15px/1.5 var(--sans);color:var(--ink-2)}
#state button{font:600 13px/1 var(--sans);color:var(--accent);background:none;
  border:1px solid var(--accent-line);padding:9px 12px;cursor:pointer;margin-left:10px}
noscript p{padding:34px 0;font:400 15px/1.5 var(--sans);color:var(--ink-2);margin:0}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap">
    <h1>GCC Philanthropy, Donors and Funders</h1>
    <p class="count-strap" id="strap">United Arab Emirates, Saudi Arabia, Qatar</p>
  </div>
</header>

<main id="main" class="wrap">
  <noscript><p>This register reads its records from a data file in the browser, so
    it needs JavaScript switched on.</p></noscript>

  <div id="state" role="status">Loading the register.</div>

  <div id="l1" hidden>
    <section class="band" aria-labelledby="h-country">
      <p class="eyebrow" id="h-country">By country</p>
      <div class="doors" id="doors"></div>
    </section>
    <section class="band" aria-labelledby="h-type">
      <p class="eyebrow" id="h-type">By kind of funder</p>
      <ol class="ranked" id="types"></ol>
      <details class="more" id="moretypes">
        <summary id="moresum"></summary>
        <ol class="ranked" id="types-rest"></ol>
      </details>
    </section>
  </div>

  <div id="l2" hidden>
    <div class="l2head">
      <a class="back" href="#" id="back">Back to countries and types</a>
      <h2 class="sel" id="selname" tabindex="-1"></h2>
      <p class="sel-sub" id="selsub"></p>
    </div>
    <div class="controls">
      <div class="search">
        <label class="sr" for="q">Search within this selection</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search name, cause, city">
      </div>
      <fieldset class="has">
        <legend>Has</legend>
        <label class="chip"><input type="checkbox" id="f-email"><span>Email</span></label>
        <label class="chip"><input type="checkbox" id="f-phone"><span>Phone</span></label>
        <label class="chip"><input type="checkbox" id="f-website"><span>Website</span></label>
      </fieldset>
    </div>
    <p class="tally" id="tally" role="status" aria-live="polite"></p>
    <ul class="recs" id="recs"></ul>
    <div class="loadmore" id="loadmore" hidden>
      <button type="button" id="loadmore-btn"></button>
    </div>
    <div class="empty" id="empty" hidden>
      <p id="emptymsg"></p>
      <button type="button" id="clearall">Clear search and filters</button>
    </div>
  </div>
</main>

<footer class="foot"><div class="wrap"><p id="footnote"></p></div></footer>

<script>
(function(){
"use strict";

/* Rows are positional arrays to keep the file small. Codex flagged that as a
   maintenance trap, correctly, so index lookup happens in exactly one place: F is
   built from the file's own keys[] and every read goes through val(). Both the key
   set and each row's length are validated at boot, so a drift between keys[] and
   rows fails loudly there instead of quietly showing a phone number in the email
   slot. */
var REQUIRED=["name","type","focus","country","city","website","email","phone",
              "linkedin","contact","title","area"];
var DATA=null, F=null, ROWS=[], NORM=null;
function val(row,key){
  var i=F[key];
  if(i===undefined) return "";
  var v=row[i];
  return v==null ? "" : String(v);
}

var PAGE=60, shown=0, current=null, filtered=[], io=null, writing=false;
var timer=null, renderSeq=0;

function el(id){ return document.getElementById(id); }
function txt(s){ return String(s==null ? "" : s); }
function num(n){ return Number(n).toLocaleString("en-GB"); }
/* Climate/Sustainability Fund holds exactly one row, and read "1 organisations".
   Every count in the interface goes through this. */
function plural(n,one,many){ return num(n)+" "+(Number(n)===1 ? one : many); }
function slug(s){
  return txt(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
/* Search normalisation. Punctuation becomes a space on BOTH sides, because the
   type names carry slashes, ampersands and brackets: before this, a search for
   "charity ngo" returned nothing at all while "Charity/NGO" returned 300. */
function norm(s){
  return txt(s).toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
}

/* every node is created and filled with textContent, so a cell of source data can
   never be parsed as markup. There is no innerHTML in this file. */
function make(tag,cls,text){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!=null && text!=="") n.textContent=txt(text);
  return n;
}
function barFor(fraction){
  var b=make("span","bar");
  b.setAttribute("aria-hidden","true");
  var i=document.createElement("i");
  i.style.width=Math.max(0,Math.min(100,fraction*100)).toFixed(1)+"%";
  b.appendChild(i);
  return b;
}

/* only http and https survive, so a malformed cell cannot become a script link */
function safeUrl(u){
  u=txt(u).trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u="https://"+u.replace(/^\/+/,"");
  try{
    var p=new URL(u);
    return (p.protocol==="http:" || p.protocol==="https:") ? p.href : "";
  }catch(e){ return ""; }
}
function safeMail(m){
  m=txt(m).trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m) ? m : "";
}
function safeTel(t){ t=txt(t).trim(); return /[0-9]/.test(t) ? t : ""; }
/* the readable part of a URL, so a website reads as its domain */
function hostOf(href){
  try{
    var u=new URL(href);
    return u.hostname.replace(/^www\./,"")
      + (u.pathname.replace(/\/+$/,"") ? "/..." : "");
  }catch(e){ return href; }
}

/* ---------- level 1 ---------- */
function buildL1(){
  var cs=DATA.meta.countries, total=DATA.meta.total;
  var top=cs.length ? cs[0].count : 1;
  var doors=el("doors");

  /* Tile width follows the square root of the count so the smallest country stays
     a usable target with legible text inside it. The bar, the count and the
     printed percentage all carry the true share, so the dampening never overstates
     a figure. Gemini argued for strictly linear width; at 128 of 1,344 that makes
     Qatar a tenth of the row, which cannot hold its own name. */
  doors.style.setProperty("--door-cols",
    cs.map(function(c){ return Math.sqrt(c.count).toFixed(2)+"fr"; }).join(" "));

  cs.forEach(function(c){
    var a=make("a","door");
    a.href="#/c/"+slug(c.name);
    a.appendChild(make("span","n",num(c.count)));
    a.appendChild(make("span","nm",c.name));
    a.appendChild(barFor(c.count/top));
    a.appendChild(make("span","go",
      (c.count/total*100).toFixed(0)+"% of the register"));
    doors.appendChild(a);
  });

  var ts=DATA.types, head=ts.slice(0,10), rest=ts.slice(10);
  var peak=head.length ? head[0].count : 1;
  function rank(list,into){
    list.forEach(function(t){
      var li=document.createElement("li");
      var a=make("a");
      a.href="#/t/"+slug(t.name);
      a.appendChild(make("span","t",t.name));
      a.appendChild(make("span","c",num(t.count)));
      a.appendChild(barFor(Math.max(0.015,t.count/peak)));
      li.appendChild(a);
      into.appendChild(li);
    });
  }
  rank(head,el("types"));
  if(rest.length){
    var sum=rest.reduce(function(a,b){ return a+b.count; },0);
    el("moresum").textContent=plural(rest.length,"more type","more types")
      + ", "+plural(sum,"organisation","organisations");
    rank(rest,el("types-rest"));
  }else{
    el("moretypes").hidden=true;
  }

  el("strap").textContent=num(total)+" organisations";
  el("footnote").textContent =
    num(DATA.meta.withEmail)+" have an email, "+num(DATA.meta.withPhone)
    + " a phone, "+num(DATA.meta.withWebsite)+" a website.";
}

/* ---------- filtering ---------- */
var SEARCH_FIELDS=["name","type","country","city","area","focus","contact","title"];
var VISIBLE_FIELDS=["name","type","country","city","area","contact","title"];

function buildNorm(){
  NORM=new Map();
  ROWS.forEach(function(r){
    NORM.set(r,{
      all: norm(SEARCH_FIELDS.map(function(k){ return val(r,k); }).join(" ")),
      vis: norm(VISIBLE_FIELDS.map(function(k){ return val(r,k); }).join(" ")),
      foc: norm(val(r,"focus"))
    });
  });
}
function matchRow(r,q){
  if(!q) return true;
  var n=NORM.get(r);
  return n ? n.all.indexOf(q)>-1 : false;
}
/* If the only reason a row matched is text the reader cannot see, that row's focus
   line opens. Codex's point: a row that matched for no visible reason reads broken. */
function onlyInFocus(r,q){
  if(!q) return false;
  var n=NORM.get(r);
  if(!n) return false;
  return n.vis.indexOf(q)===-1 && n.foc.indexOf(q)>-1;
}

function readControls(){
  return {
    q: norm(el("q").value),
    email: el("f-email").checked,
    phone: el("f-phone").checked,
    website: el("f-website").checked
  };
}
function computeFiltered(rows,c){
  return rows.filter(function(r){
    if(c.email && !val(r,"email")) return false;
    if(c.phone && !val(r,"phone")) return false;
    if(c.website && !val(r,"website")) return false;
    return matchRow(r,c.q);
  });
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

function apply(){
  if(!current) return;
  filtered=computeFiltered(current.rows,readControls());
  shown=0;
  renderSeq++;
  clear(el("recs"));
  paint();
  writeHash(true);
}

/* ---------- rows ---------- */
function contactLine(a,extra){
  var r=make("div","r");
  r.appendChild(a);
  if(extra) r.appendChild(extra);
  return r;
}
function routeLink(href,label,external){
  var a=make("a",null,label);
  a.href=href;
  if(external){ a.target="_blank"; a.rel="noopener noreferrer"; }
  return a;
}
function routesFor(r){
  var box=make("div","routes");
  var w=safeUrl(val(r,"website")), m=safeMail(val(r,"email"));
  var t=safeTel(val(r,"phone")), l=safeUrl(val(r,"linkedin"));
  var nm=val(r,"name");
  if(m){
    var cp=make("button","copy","Copy");
    cp.type="button";
    cp.setAttribute("data-copy",m);
    cp.setAttribute("aria-label","Copy the email address for "+nm);
    box.appendChild(contactLine(routeLink("mailto:"+m,m,false),cp));
  }
  if(t){
    box.appendChild(contactLine(
      routeLink("tel:"+t.replace(/[^0-9+]/g,""),t,false)));
  }
  if(w) box.appendChild(contactLine(routeLink(w,hostOf(w),true)));
  if(l) box.appendChild(contactLine(routeLink(l,"LinkedIn",true)));
  if(!box.firstChild){
    box.appendChild(make("span","none","No contact published in the source"));
  }
  return box;
}

function recFor(r,i,q){
  var open=onlyInFocus(r,q);
  var focus=val(r,"focus");
  var long=focus.length>170;
  /* the render sequence is in the id, so an aria-controls pair can never point at
     a stale node from an earlier filter */
  var id="f"+renderSeq+"-"+i;
  var li=make("li","rec");

  li.appendChild(make("p","nm",val(r,"name")));

  var meta=make("p","meta");
  meta.appendChild(make("b",null,val(r,"type")));
  var place=[val(r,"city"),val(r,"country")].filter(Boolean).join(", ");
  if(place) meta.appendChild(document.createTextNode(" · "+place));
  li.appendChild(meta);

  var f=make("p","focus"+((long && !open) ? " clamp" : ""),focus);
  f.id=id;
  li.appendChild(f);

  if(long){
    var b=make("button","expand",open ? "Show less" : "Show more");
    b.type="button";
    b.setAttribute("aria-expanded",open ? "true" : "false");
    b.setAttribute("aria-controls",id);
    li.appendChild(b);
  }

  var who=val(r,"contact"), title=val(r,"title");
  if(who) li.appendChild(make("p","who",who+(title ? ", "+title : "")));

  li.appendChild(routesFor(r));
  return li;
}

function paint(){
  if(!current) return;
  var q=readControls().q;
  var next=filtered.slice(shown,shown+PAGE);
  if(next.length){
    var frag=document.createDocumentFragment();
    next.forEach(function(r,k){ frag.appendChild(recFor(r,shown+k,q)); });
    el("recs").appendChild(frag);
    shown+=next.length;
  }
  var left=filtered.length-shown;
  el("loadmore").hidden = left<=0;
  if(left>0){
    el("loadmore-btn").textContent =
      "Show "+Math.min(PAGE,left)+" more of "+num(filtered.length);
  }
  el("tally").textContent = filtered.length
    ? ("Showing "+num(shown)+" of "+num(filtered.length)
        + (filtered.length!==current.rows.length
            ? ", filtered from "+num(current.rows.length) : ""))
    : "";
  var none=el("empty");
  if(!filtered.length){
    el("emptymsg").textContent="Nothing in "+current.name+" matches that.";
    none.hidden=false;
  }else{
    none.hidden=true;
  }
  observeTail();
}

/* auto-append near the bottom, with the button always present as the deterministic
   control. Codex: infinite scroll on its own is an accessibility trap. */
function observeTail(){
  if(io) io.disconnect();
  if(el("loadmore").hidden || !("IntersectionObserver" in window)) return;
  io=new IntersectionObserver(function(entries){
    if(entries[0].isIntersecting) paint();
  },{rootMargin:"600px 0px"});
  io.observe(el("loadmore"));
}

/* ---------- routing ---------- */
var SLUGS={c:{},t:{}};
function buildSlugs(){
  function add(kind,list){
    list.forEach(function(item){
      var s=slug(item.name);
      if(SLUGS[kind][s]){
        /* not present in the current data, checked; this keeps a future rename
           from silently merging two categories under one slug */
        console.warn("duplicate slug "+kind+"/"+s+": "
          + SLUGS[kind][s].name+" and "+item.name);
        return;
      }
      SLUGS[kind][s]=item;
    });
  }
  add("c",DATA.meta.countries);
  add("t",DATA.types);
}
function select(kind,s){
  var item=SLUGS[kind][s];
  if(!item) return null;
  var field=(kind==="c") ? "country" : "type";
  var list=ROWS.filter(function(r){ return val(r,field)===item.name; });
  var keys={}, sub;
  if(kind==="c"){
    list.forEach(function(r){ var a=val(r,"area"); if(a) keys[a]=1; });
    sub=plural(list.length,"organisation","organisations")+" across "
      + plural(Object.keys(keys).length,"city or region","cities and regions");
  }else{
    list.forEach(function(r){ keys[val(r,"country")]=1; });
    sub=plural(list.length,"organisation","organisations")+" in "
      + plural(Object.keys(keys).length,"country","countries");
  }
  return {kind:kind,slug:s,name:item.name,sub:sub,rows:list};
}

function writeHash(replace){
  if(!current) return;
  var c=readControls(), p=[];
  if(c.q) p.push("q="+encodeURIComponent(el("q").value.trim()));
  var has=["email","phone","website"].filter(function(k){ return c[k]; });
  if(has.length) p.push("has="+has.join(","));
  var h="#/"+current.kind+"/"+current.slug+(p.length ? "?"+p.join("&") : "");
  if(location.hash===h) return;
  writing=true;
  if(replace && history.replaceState) history.replaceState(null,"",h);
  else location.hash=h;
  setTimeout(function(){ writing=false; },0);
}

function route(){
  if(writing) return;
  clearTimeout(timer);          /* a pending search must not land on a new route */
  var raw=location.hash.replace(/^#\/?/,"");
  if(!raw){ showL1(false); return; }
  var qs="", i=raw.indexOf("?");
  if(i>-1){ qs=raw.slice(i+1); raw=raw.slice(0,i); }
  var parts=raw.split("/").filter(Boolean);
  var kind=(parts[0]||"").toLowerCase(), s;
  try{ s=slug(decodeURIComponent(parts[1]||"")); }
  catch(e){ s=slug(parts[1]||""); }
  if((kind!=="c" && kind!=="t") || !s){ showL1(true); return; }
  var sel=select(kind,s);
  if(!sel){ showL1(true); return; }
  current=sel;

  /* split on the FIRST equals only, so a query containing one survives */
  var p={};
  qs.split("&").forEach(function(kv){
    if(!kv) return;
    var eq=kv.indexOf("="), k=eq<0 ? kv : kv.slice(0,eq);
    var v=eq<0 ? "" : kv.slice(eq+1);
    try{ p[k]=decodeURIComponent(v.replace(/\+/g," ")); }
    catch(e){ p[k]=v; }
  });
  el("q").value=p.q||"";
  var has=(p.has||"").split(",");
  el("f-email").checked=has.indexOf("email")>-1;
  el("f-phone").checked=has.indexOf("phone")>-1;
  el("f-website").checked=has.indexOf("website")>-1;

  el("l1").hidden=true;
  el("l2").hidden=false;
  el("selname").textContent=sel.name;
  el("selsub").textContent=sel.sub;
  document.title=sel.name+" | GCC Philanthropy, Donors and Funders";
  filtered=computeFiltered(sel.rows,readControls());
  shown=0;
  renderSeq++;
  clear(el("recs"));
  paint();
  window.scrollTo(0,0);
  el("selname").focus();
}

function showL1(clean){
  clearTimeout(timer);
  current=null;
  filtered=[];
  if(io) io.disconnect();
  el("l2").hidden=true;
  el("l1").hidden=false;
  document.title="GCC Philanthropy, Donors and Funders";
  if(clean && history.replaceState){
    history.replaceState(null,"",location.pathname+location.search);
  }
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
function onSearch(){
  clearTimeout(timer);
  /* remember which selection this keystroke belongs to, so a debounced apply
     cannot run against a selection the user has since left */
  var owner=current;
  timer=setTimeout(function(){
    if(current===owner) apply();
  },160);
}

function wire(){
  el("q").addEventListener("input",onSearch);
  ["f-email","f-phone","f-website"].forEach(function(id){
    el(id).addEventListener("change",apply);
  });
  el("loadmore-btn").addEventListener("click",paint);
  el("clearall").addEventListener("click",function(){
    el("q").value="";
    el("f-email").checked=false;
    el("f-phone").checked=false;
    el("f-website").checked=false;
    apply();
  });
  /* deterministic: always go to level 1. history.length cannot tell us whether the
     previous entry belongs to this site, so history.back() could leave it. */
  el("back").addEventListener("click",function(e){
    e.preventDefault();
    if(location.hash){ location.hash=""; }
    else { showL1(true); }
  });
  /* one delegated listener for the whole list, however long it grows */
  el("recs").addEventListener("click",function(e){
    if(!e.target.closest) return;
    var ex=e.target.closest(".expand");
    if(ex){
      var p=document.getElementById(ex.getAttribute("aria-controls"));
      var open=ex.getAttribute("aria-expanded")==="true";
      ex.setAttribute("aria-expanded",open ? "false" : "true");
      ex.textContent = open ? "Show more" : "Show less";
      if(p) p.classList.toggle("clamp",open);
      return;
    }
    var cp=e.target.closest(".copy");
    if(cp){
      var v=cp.getAttribute("data-copy");
      var done=function(ok){
        cp.textContent = ok ? "Copied" : "Select it";
        setTimeout(function(){ cp.textContent="Copy"; },1800);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(v).then(function(){ done(true); },
                                             function(){ done(false); });
      }else{
        done(false);
      }
    }
  });
  window.addEventListener("hashchange",route);
}

/* ---------- boot ---------- */
function fail(msg){
  var s=el("state");
  clear(s);
  s.hidden=false;
  s.appendChild(document.createTextNode(msg));
  var b=make("button",null,"Try again");
  b.type="button";
  b.addEventListener("click",function(){ location.reload(); });
  s.appendChild(b);
}

fetch("data.json",{cache:"no-cache"}).then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(d){
  if(!d || !d.rows || !d.keys || !d.meta) throw new Error("malformed data");
  DATA=d;
  F={};
  var seen={};
  d.keys.forEach(function(k,i){
    if(seen[k]) throw new Error("duplicate column key: "+k);
    seen[k]=1;
    F[k]=i;
  });
  var missing=REQUIRED.filter(function(k){ return F[k]===undefined; });
  if(missing.length) throw new Error("missing columns: "+missing.join(", "));
  var n=d.keys.length, bad=0;
  ROWS=d.rows.filter(function(r){
    if(!Array.isArray(r) || r.length!==n){ bad++; return false; }
    return true;
  });
  if(bad) console.warn("skipped "+bad+" rows whose length did not match keys");
  if(!ROWS.length) throw new Error("no usable rows");
  buildNorm();
  buildSlugs();
  el("state").hidden=true;
  buildL1();
  wire();
  route();
}).catch(function(e){
  fail("The register could not be loaded ("+e.message+"). ");
});
})();
</script>
</body>
</html>
