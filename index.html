<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gulf Cooperation Council (GCC) Philanthropy, Donors and Funders</title>
<meta name="description" content="Directory of philanthropic funders, foundations, corporate giving programmes and endowments in the United Arab Emirates, Saudi Arabia and Qatar.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='10' fill='%23006C35'/><path d='M0 10a10 10 0 0 1 10-10h6v48h-6a10 10 0 0 1-10-10z' fill='%23CE1126'/><path d='M32 0h6a10 10 0 0 1 10 10v28a10 10 0 0 1-10 10h-6z' fill='%238A1538'/></svg>">
<!--
ANTI_SLOP_BRIEF
  bold move:  level one is three doors and a ranked list, nothing else. The country
              doors carry a flag-derived mark and the country name only, no figures,
              so choosing a place is a single uncomplicated act; the counts live with
              the funder types, where comparing them is the actual point.
  type:       system serif for organisation and country names, system sans for chrome,
              figures and contact details. This is a reference register of
              institutions, so the serif says record rather than product, and it is
              also what keeps the borrowed search-results structure from reading as a
              Google pastiche. No web fonts, so nothing to download.
  colour:     one accent, #1F4E3D, taken from the header rows of the source
              spreadsheet, so the site and the workbook read as one deliverable. The
              country marks are the only other colour and they come from the flags.
  shape:      a SET of independent organisations reached through two hierarchies
              (place, kind). Level two is therefore a list of names that open, not a
              grid of cards: a reader scans names, then asks one of them for detail.
  verifiable: every figure is counted from data.json at run time, and that file is
              exported from the workbook. The page states no number it did not
              compute. An opened record shows its real email address and phone number
              as text, so a contact can be read without clicking through.
  absent by decision: hero paragraph, About, Contact form, testimonials, decorative
              icons, onboarding, sponsor logos, coverage statistics, any generated
              commentary or insight.

  On the country marks: Windows browsers do not render regional-indicator flag emoji,
  and the Saudi flag carries the shahada, which should not be approximated in
  hand-drawn geometry. So these are flag-DERIVED marks, not flag reproductions.

  Borrowed from Google deliberately, on Gemini's advice: a left-aligned result column
  with a measured line length, a pill search field with a soft shadow that lifts on
  focus, quiet grey metadata above a prominent title, and numbered pagination.
  Deliberately NOT borrowed: its palette, its typefaces, its card elevation.

  Every node is built with createElement and textContent. There is no innerHTML in
  this file, so no cell of the source data is ever parsed as markup.
-->
<style>
:root{
  /* ink-3 is #5A5E61 rather than a lighter grey because the small labels sit over
     the flag wash, where a lighter grey measured 3.66:1. axe cannot composite
     through a mask, so this one was computed by hand: worst case now 4.96:1. */
  --ink:#191A17; --ink-2:#4D5156; --ink-3:#5A5E61;
  --accent:#1F4E3D; --accent-2:#2C6B53; --accent-soft:#EAF2EE; --accent-line:#BFD5CB;
  --paper:#FFFFFF; --paper-2:#F8F9F7; --line:#E4E6E2; --line-2:#D3D6D1;
  --focus:#1F4E3D;
  --shadow:0 1px 3px rgba(25,26,23,.10);
  --shadow-up:0 6px 20px rgba(25,26,23,.10);
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:48px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#F1F2EF; --ink-2:#BDC1C6; --ink-3:#9AA0A6;
    --accent:#8FD1B4; --accent-2:#A6DCC4; --accent-soft:#16241F; --accent-line:#335347;
    --paper:#131513; --paper-2:#1B1E1B; --line:#2B2E2B; --line-2:#3A3E3A;
    --focus:#8FD1B4;
    --shadow:0 1px 6px rgba(0,0,0,.5);
    --shadow-up:0 1px 10px rgba(143,209,180,.22);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 var(--s4)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--paper);color:var(--accent);
      padding:10px 14px;z-index:9;border:1px solid var(--accent)}
.skip:focus{left:12px;top:12px}

/* masthead: the title, and nothing beside it */
header.top{border-bottom:1px solid var(--line);background:var(--paper-2)}
header.top .wrap{padding-top:var(--s4);padding-bottom:var(--s4)}
h1{font:400 22px/1.2 var(--serif);margin:0;letter-spacing:0}
h1 a{color:inherit;text-decoration:none;display:inline-block}
h1 a:hover{color:var(--accent)}
h1 .abbr{color:var(--ink-3);font-weight:400}

.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 var(--s4)}
section.band{padding:var(--s5) 0}
section.band + section.band{border-top:1px solid var(--line)}

/* ---------- level 1: country doors, name only ---------- */
.doors{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media (min-width:700px){ .doors{grid-template-columns:repeat(3,1fr)} }
.door{
  display:flex;align-items:center;gap:var(--s3);text-decoration:none;color:inherit;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:var(--s4);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease;
}
.door:hover,.door:focus-visible{box-shadow:var(--shadow-up);border-color:var(--accent-line);
  transform:translateY(-1px)}
.door .mark{flex:0 0 auto;width:46px;height:31px;border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.10) inset;display:block}
.door .nm{font:400 20px/1.22 var(--serif);color:var(--ink);letter-spacing:0;
  text-wrap:balance}

/* ---------- level 1: the kinds of funder, as tiles ---------- */
ol.ranked{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2);
  grid-template-columns:1fr}
@media (min-width:560px){ ol.ranked{grid-template-columns:1fr 1fr} }
@media (min-width:860px){ ol.ranked{grid-template-columns:1fr 1fr 1fr} }
ol.ranked a{
  display:flex;align-items:center;min-height:60px;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:14px var(--s3) 14px calc(var(--s3) + 4px);text-decoration:none;color:inherit;
  position:relative;overflow:hidden;
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
/* a hairline of the accent down the leading edge, which grows on hover: the one
   moving part on this page, so it reads as a response rather than decoration */
ol.ranked a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);transform:scaleY(.34);transform-origin:center;
  transition:transform .2s ease}
ol.ranked a:hover,ol.ranked a:focus-visible{border-color:var(--accent-line);
  box-shadow:var(--shadow);transform:translateY(-1px)}
ol.ranked a:hover::before,ol.ranked a:focus-visible::before{transform:scaleY(1)}
ol.ranked .t{font:400 16px/1.32 var(--serif);letter-spacing:0}
details.more{margin-top:var(--s4)}
details.more summary{font:600 13px/1 var(--sans);color:var(--accent);cursor:pointer;
  padding:10px 0;width:max-content}
details.more ol.ranked{margin-top:var(--s3)}

/* The flag on a country page: a plate at the flag's own proportions, shown WHOLE and
   undistorted at a size where it reads. Not a crop, not a wash. The Saudi flag
   carries the shahada, so a faded sliver of it behind body text would be the wrong
   treatment; every flag is therefore presented the same way, intact. */
/* Sized by HEIGHT, not width. The three flags run from 3:2 to 28:11, so one fixed
   width made the Saudi panel 193px tall against a 210px header and it collided with
   the controls below. Equal height is also how flags are actually displayed side by
   side. */
.flagplate{display:block;width:max-content;max-width:100%;margin:0 0 var(--s4);
  border-radius:5px;overflow:hidden;line-height:0;background:var(--paper);
  box-shadow:0 14px 34px rgba(25,26,23,.13),0 0 0 1px rgba(25,26,23,.12)}
.flagplate svg{display:block;height:104px;width:auto;max-width:100%}
@media (min-width:820px){
  #l2.hasback .l2head{padding-right:350px;min-height:196px}
  .flagplate{position:absolute;right:0;top:var(--s5);margin:0}
  .flagplate svg{height:124px}
  .l2head{position:relative}
}
@media (max-width:560px){
  .flagplate{margin-bottom:var(--s3)}
  .flagplate svg{height:82px}
}

/* ---------- flag backdrops ----------
   Drawn as vector here rather than lifted from a news photograph, so it is
   licence-clean, stays crisp at any size, and the opacity is ours to control.
   The mask crops each flag to its distinctive geometry and fades it out well
   before it reaches any text. Purely decorative, aria-hidden, never a target. */
.hasback{position:relative;isolation:isolate}
.hasback > *:not(.flagback){position:relative;z-index:1}
.flagback{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
/* The mask has to finish INSIDE the box on every axis. At 125% it still painted to
   the rectangle boundary, which read as a stray panel rather than a wash. */
.flagback{
  --m:linear-gradient(90deg,transparent 0 42%,rgba(0,0,0,.55) 66%,#000 88%);
  -webkit-mask-image:var(--m); mask-image:var(--m);
}
.flagback svg{position:absolute;opacity:.30}
@media (prefers-color-scheme:dark){ .flagback svg{opacity:.34} }
/* On a country page the backdrop is COLOUR ONLY, taken from that flag, never the
   artwork: the flag itself is shown whole in the plate above the heading instead. */
.flagback.one{height:300px;bottom:auto;border-radius:0;
  background:radial-gradient(58% 62% at 84% 34%,var(--wash) 0,transparent 72%);
  -webkit-mask-image:none;mask-image:none;opacity:.5}
@media (prefers-color-scheme:dark){ .flagback.one{opacity:.36} }
@media (max-width:699px){ .flagback.one{height:220px} }
/* The three flags across the landing band, each shown WHOLE at its own proportions
   and set to the right so they sit clear of the eyebrow and the doors. Sizing by
   height would have cropped them, because the three ratios differ by a factor of
   nearly two. */
.flagback.trio{display:flex;justify-content:flex-end;align-items:center;
  gap:12px;padding:0 max(24px,calc((100% - 1000px) / 2 + 24px)) 0 0}
/* Each flag is small enough to sit COMPLETE inside the fade. An earlier attempt sized
   them to 23% of the band, and the mask then cut the Saudi flag through the middle of
   the shahada, which is not an acceptable way to render a creed. Whole, undistorted,
   or not at all. */
.flagback.trio svg{position:static;flex:0 0 auto;width:58px;height:auto}
@media (max-width:820px){ .flagback.trio{display:none} }

/* ---------- level 2 ---------- */
.l2head{padding:var(--s4) 0 0}
.back{display:inline-block;font:600 13px/1 var(--sans);text-decoration:none;padding:8px 0}
.back:hover{text-decoration:underline}
h2.sel{font:400 32px/1.1 var(--serif);margin:var(--s2) 0 var(--s1);letter-spacing:0}
@media (min-width:700px){ h2.sel{font-size:42px;line-height:1.05} }
h2.sel:focus,h2.sel:focus-visible{outline:none}
.sel-sub{font:400 14px/1.5 var(--sans);color:var(--ink-3);margin:0}

.controls{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;
  padding:var(--s4) 0 var(--s3)}
/* the pill search, borrowed from Google and tinted to the accent on focus */
.search{flex:1 1 320px;max-width:560px;display:flex}
.search input{
  width:100%;height:48px;font:16px/1.2 var(--sans);color:var(--ink);
  background:var(--paper);border:1px solid var(--line-2);border-radius:24px;
  padding:0 var(--s4);box-shadow:var(--shadow);
  transition:box-shadow .16s ease,border-color .16s ease;
}
.search input::placeholder{color:var(--ink-3)}
.search input:hover{box-shadow:var(--shadow-up)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow-up)}
.search input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.pick{display:flex;align-items:center;gap:var(--s2)}
.pick label{font:700 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3)}
.pick select{
  font:500 14px/1 var(--sans);color:var(--ink);background:var(--paper);
  border:1px solid var(--line-2);border-radius:20px;padding:11px 14px;
  max-width:240px;cursor:pointer;
}
.pick select:hover{border-color:var(--accent-line)}

fieldset.has{border:0;margin:0;padding:0;display:flex;gap:var(--s2);flex-wrap:wrap;
  align-items:center}
fieldset.has legend{float:left;font:700 10px/40px var(--sans);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);padding:0 var(--s2) 0 0}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;font:600 13px/1 var(--sans);color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:20px;padding:11px 14px;background:var(--paper);
  transition:background .14s ease,border-color .14s ease,color .14s ease}
.chip input:hover + span{border-color:var(--accent-line)}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
@media (prefers-color-scheme:dark){ .chip input:checked + span{color:#0F1412} }
.chip input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}

.tally{font:400 13px/1.5 var(--sans);color:var(--ink-3);margin:0;
  padding:var(--s2) 0 var(--s3);border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}

/* ---------- the list: names that open ---------- */
ul.recs{list-style:none;margin:0;padding:0}
li.rec{border-bottom:1px solid var(--line)}
.rowbtn{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  width:100%;background:none;border:0;cursor:pointer;text-align:left;
  padding:var(--s3) var(--s2);font:inherit;color:inherit;border-radius:8px;
  transition:background .14s ease;
}
.rowbtn{position:relative}
.rowbtn::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
  background:transparent;border-radius:1px;transition:background .16s ease}
.rowbtn:hover::before,.rowbtn[aria-expanded="true"]::before{background:var(--accent)}
.rowbtn:hover{background:transparent}
.rowbtn .nm{font:400 19px/1.34 var(--serif);color:var(--ink);letter-spacing:0;
  transition:color .16s ease}
.rowbtn:hover .nm,.rowbtn:focus-visible .nm{color:var(--accent)}
.rowbtn[aria-expanded="true"] .nm{color:var(--accent)}
.caret{flex:0 0 auto;width:22px;height:22px;position:relative}
.caret::before,.caret::after{content:"";position:absolute;background:var(--ink-3);
  border-radius:1px;transition:transform .18s ease,opacity .18s ease}
.caret::before{left:4px;right:4px;top:10px;height:2px}
.caret::after{top:4px;bottom:4px;left:10px;width:2px}
.rowbtn[aria-expanded="true"] .caret::after{transform:scaleY(0);opacity:0}

.panel{padding:0 var(--s2) var(--s4) var(--s2)}
dl.rec-dl{margin:0;display:grid;grid-template-columns:1fr;gap:var(--s3)}
@media (min-width:760px){
  dl.rec-dl{grid-template-columns:150px minmax(0,1fr);gap:var(--s3) var(--s4);
    align-items:baseline}
}
dl.rec-dl dt{font:700 10px/1.5 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0}
dl.rec-dl dd{margin:0;font:400 15px/1.6 var(--sans);color:var(--ink);max-width:68ch}
@media (max-width:759px){ dl.rec-dl dt{margin-bottom:calc(var(--s1) * -2)} }

.routes{display:flex;flex-direction:column;gap:var(--s1);align-items:flex-start}
.routes .r{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.routes a{font:500 15px/1.5 var(--sans);color:var(--accent);text-decoration:none;
  padding:3px 0;overflow-wrap:anywhere;border-bottom:1px solid transparent}
.routes a:hover,.routes a:focus-visible{border-bottom-color:currentColor}
.routes .copy{font:700 10px/1 var(--sans);color:var(--ink-3);background:none;
  border:1px solid var(--line-2);border-radius:14px;padding:7px 10px;cursor:pointer;
  letter-spacing:.1em;text-transform:uppercase;min-height:26px}
.routes .copy:hover{color:var(--accent);border-color:var(--accent-line)}
.routes .none{font:400 15px/1.5 var(--sans);color:var(--ink-3)}

/* ---------- pagination ---------- */
nav.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:var(--s2);padding:var(--s5) 0 var(--s4)}
nav.pager a,nav.pager span{font:500 14px/1 var(--sans);min-width:38px;min-height:38px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 12px;
  border-radius:20px;text-decoration:none;color:var(--accent)}
nav.pager a:hover{background:var(--accent-soft)}
nav.pager .on{background:var(--accent);color:#FFFFFF;font-weight:700}
@media (prefers-color-scheme:dark){ nav.pager .on{color:#0F1412} }
nav.pager .gap{color:var(--ink-3);min-width:20px;padding:0 2px}
nav.pager .edge{font-weight:600}
/* A spent Previous or Next stays legible. At opacity .5 it composited to 2.67:1 in
   dark mode: axe called it, and a control you cannot read is not a kindness. It is
   distinguished by having no hover and no href, not by being faint. */
nav.pager .off{color:var(--ink-3);pointer-events:none;cursor:default}
/* Nine controls do not fit 327px of usable width, so on a phone they are tightened
   and given a row gap: if the row does wrap it reads as two deliberate rows rather
   than a spill. The targets stay at or above 24px. */
nav.pager .pg-sm{display:none}
@media (max-width:520px){
  nav.pager{gap:5px;row-gap:10px;padding:var(--s4) 0}
  nav.pager a,nav.pager span{min-width:34px;padding:0 7px;font-size:13px}
  /* Measured: the row needed 348px against 312px. The two ellipses are decorative and
     removing them saves exactly the 38px that was missing, so the pager holds one
     line instead of orphaning Next on a second. */
  nav.pager .gap{display:none}
  nav.pager .pg-lg{display:none}
  nav.pager .pg-sm{display:inline}
}

.empty{padding:var(--s5) 0;color:var(--ink-2);font-size:15px}
.empty button{font:600 13px/1 var(--sans);color:var(--accent);background:none;
  border:1px solid var(--accent-line);border-radius:20px;padding:11px 16px;
  cursor:pointer;margin-top:var(--s3)}

/* one quiet line, set to the right, in the serif so it reads as a signature rather
   than as another piece of interface */
footer.sig{border-top:1px solid var(--line);margin-top:var(--s5)}
footer.sig .wrap{padding-top:var(--s3);padding-bottom:var(--s4)}
footer.sig p{margin:0;text-align:right;font:400 12.5px/1.6 var(--sans);color:var(--ink-3)}
footer.sig a{font:italic 600 14px/1.6 var(--serif);color:var(--accent);
  text-decoration:none;border-bottom:1px solid transparent;letter-spacing:.15px;
  transition:border-color .16s ease}
footer.sig a:hover,footer.sig a:focus-visible{border-bottom-color:currentColor}

#state{padding:var(--s5) 0;font:400 15px/1.6 var(--sans);color:var(--ink-2)}
#state button{font:600 13px/1 var(--sans);color:var(--accent);background:none;
  border:1px solid var(--accent-line);border-radius:20px;padding:9px 14px;
  cursor:pointer;margin-left:var(--s3)}
noscript p{padding:var(--s5) 0;font:400 15px/1.6 var(--sans);color:var(--ink-2);margin:0}
main{padding-bottom:var(--s5)}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .door:hover{transform:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap"><h1><a href="#" id="home">Gulf Cooperation Council <span class="abbr">(GCC)</span> Philanthropy, Donors and Funders</a></h1></div>
</header>

<main id="main" class="wrap">
  <noscript><p>This register reads its records from a data file in the browser, so it
    needs JavaScript switched on.</p></noscript>

  <div id="state" role="status">Loading the register.</div>

  <div id="l1" hidden>
    <section class="band" aria-labelledby="h-country">
      <p class="eyebrow" id="h-country">By country</p>
      <div class="doors" id="doors"></div>
    </section>
    <section class="band" aria-labelledby="h-type">
      <p class="eyebrow" id="h-type">By kind of funder</p>
      <ol class="ranked" id="types"></ol>
      <details class="more" id="moretypes">
        <summary id="moresum"></summary>
        <ol class="ranked" id="types-rest"></ol>
      </details>
    </section>
  </div>

  <div id="l2" hidden>
    <div class="l2head">
      <a class="back" href="#" id="back">Back to countries and types</a>
      <span class="flagplate" id="flagplate" aria-hidden="true" hidden></span>
      <h2 class="sel" id="selname" tabindex="-1"></h2>
      <p class="sel-sub" id="selsub"></p>
    </div>
    <div class="controls">
      <div class="search">
        <label class="sr" for="q">Search within this selection</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search name, cause, city">
      </div>
      <div class="pick" id="pickwrap" hidden>
        <label for="pick" id="picklabel">Where</label>
        <select id="pick"></select>
      </div>
      <fieldset class="has">
        <legend>Has</legend>
        <label class="chip"><input type="checkbox" id="f-email"><span>Email</span></label>
        <label class="chip"><input type="checkbox" id="f-phone"><span>Phone</span></label>
        <label class="chip"><input type="checkbox" id="f-website"><span>Website</span></label>
      </fieldset>
    </div>
    <p class="tally" id="tally" role="status" aria-live="polite"></p>
    <ul class="recs" id="recs"></ul>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
    <div class="empty" id="empty" hidden>
      <p id="emptymsg"></p>
      <button type="button" id="clearall">Clear search and filters</button>
    </div>
  </div>
</main>

<footer class="sig"><div class="wrap">
  <p>Compiled by <a href="https://www.linkedin.com/in/ali-al-mokdad/"
     target="_blank" rel="noopener noreferrer">Ali Al Mokdad</a></p>
</div></footer>

<script>
(function(){
"use strict";

/* Rows are positional arrays to keep the file small. Codex flagged that as a
   maintenance trap, correctly, so index lookup happens in exactly one place: F is
   built from the file's own keys[] and every read goes through val(). Both the key
   set and each row's length are validated at boot. */
var REQUIRED=["name","type","focus","country","city","website","email","phone",
              "linkedin","contact","title","area"];
var DATA=null, F=null, ROWS=[], NORM=null;
function val(row,key){
  var i=F[key];
  if(i===undefined) return "";
  var v=row[i];
  return v==null ? "" : String(v);
}

var PER_PAGE=20, page=1, current=null, filtered=[], writing=false;
var timer=null, seq=0;

function el(id){ return document.getElementById(id); }
function txt(s){ return String(s==null ? "" : s); }
function num(n){ return Number(n).toLocaleString("en-GB"); }
function plural(n,one,many){ return num(n)+" "+(Number(n)===1 ? one : many); }
function slug(s){
  return txt(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
/* Search normalisation. Punctuation becomes a space on BOTH sides, because the type
   names carry slashes, brackets and ampersands: before this, "charity ngo" returned
   nothing while "Charity/NGO" returned 300. */
function norm(s){
  return txt(s).toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
}

/* every node is created and filled with textContent. There is no innerHTML here. */
function make(tag,cls,text){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!=null && text!=="") n.textContent=txt(text);
  return n;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

var SVGNS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs){
  var n=document.createElementNS(SVGNS,tag);
  for(var k in attrs) if(attrs.hasOwnProperty(k)) n.setAttribute(k,attrs[k]);
  return n;
}
/* Flag-DERIVED marks, not flag reproductions. Windows browsers do not render
   regional-indicator flag emoji, and the Saudi flag carries the shahada, which
   should not be approximated in hand-drawn geometry. */
/* THE THREE FLAGS, drawn to their official proportions. Notes and sources in
   flags.js.txt beside this file. Each returns an <svg> at the flag's own aspect
   ratio, so nothing is stretched. A previous build reduced Saudi Arabia to a plain
   green rectangle, which is not the flag: the shahada is real Arabic text set in a
   system Arabic face, and the sword is beneath it pointing to the hoist. */
var FLAG_BOX={"united arab emirates":[60,30],"saudi arabia":[60,40],"qatar":[56,22]};
var AR_FACE="'Traditional Arabic','Arabic Typesetting','Noto Naskh Arabic',"
          + "'Segoe UI','Times New Roman',serif";

function flagRatio(name){
  var b=FLAG_BOX[norm(name)];
  return b ? b[0]/b[1] : 1.5;
}
function countryMark(name,cls){
  var n=norm(name), box=FLAG_BOX[n]||[60,40];
  var s=svgEl("svg",{viewBox:"0 0 "+box[0]+" "+box[1],"aria-hidden":"true",
                     class:(cls||"mark")});
  if(n==="united arab emirates"){
    /* red band one quarter of the length at the hoist, then green, white, black */
    s.appendChild(svgEl("rect",{x:15,y:0,width:45,height:10,fill:"#00732F"}));
    s.appendChild(svgEl("rect",{x:15,y:10,width:45,height:10,fill:"#FFFFFF"}));
    s.appendChild(svgEl("rect",{x:15,y:20,width:45,height:10,fill:"#000000"}));
    s.appendChild(svgEl("rect",{x:0,y:0,width:15,height:30,fill:"#CE1126"}));
  }else if(n==="saudi arabia"){
    s.appendChild(svgEl("rect",{x:0,y:0,width:60,height:40,fill:"#006C35"}));
    /* textLength is not decoration here: it is the only way to guarantee the whole
       shahada fits the field on a machine whose Arabic font has different metrics
       from ours. Measured without it, the string ran 78 units wide inside a 60 unit
       viewBox and was clipped at BOTH ends, which is not something to ship. */
    var t=svgEl("text",{x:30,y:18.5,"text-anchor":"middle",fill:"#FFFFFF",
      "font-family":AR_FACE,"font-size":"8","font-weight":"400",
      "textLength":"46","lengthAdjust":"spacingAndGlyphs",
      "xml:lang":"ar","direction":"rtl"});
    t.textContent="لا إله إلا الله "
                + "محمد رسول الله";
    s.appendChild(t);
    /* sword: tapered blade pointing to the hoist, then guard, grip and pommel */
    s.appendChild(svgEl("path",{d:"M8,28 L13,26.4 L45,26.7 L45,29.3 L13,29.6 Z",
      fill:"#FFFFFF"}));
    s.appendChild(svgEl("rect",{x:45,y:24.4,width:1.5,height:7.2,fill:"#FFFFFF"}));
    s.appendChild(svgEl("rect",{x:46.5,y:27.1,width:3.6,height:1.8,fill:"#FFFFFF"}));
    s.appendChild(svgEl("circle",{cx:50.9,cy:28,r:1.2,fill:"#FFFFFF"}));
  }else if(n==="qatar"){
    s.appendChild(svgEl("rect",{x:0,y:0,width:56,height:22,fill:"#8A1538"}));
    /* nine points, the number that gives the flag its meaning */
    var pts=["0,0","13,0"], step=22/9, i;
    for(i=0;i<9;i++){
      pts.push("19.5,"+((i+0.5)*step).toFixed(3));
      pts.push("13,"+((i+1)*step).toFixed(3));
    }
    pts.push("0,22");
    s.appendChild(svgEl("polygon",{points:pts.join(" "),fill:"#FFFFFF"}));
  }else{
    s.appendChild(svgEl("rect",{x:0,y:0,width:box[0],height:box[1],fill:"#1F4E3D"}));
  }
  return s;
}

/* the colour each country page is tinted with, taken from that country's flag */
var FLAG_WASH={"united arab emirates":"#00732F","saudi arabia":"#006C35",
               "qatar":"#8A1538"};

/* Paint a decorative backdrop behind a block. Level one carries the three flags,
   shown whole. A country page carries COLOUR ONLY, because its flag is presented
   intact in the plate beside the heading and a faded crop of the Saudi flag, which
   carries the shahada, would be the wrong treatment. aria-hidden throughout, never
   a pointer target. */
function paintBackdrop(host,countryName){
  var old=host.querySelector(":scope > .flagback");
  if(old) old.parentNode.removeChild(old);
  host.classList.add("hasback");
  var back=make("div","flagback "+(countryName ? "one" : "trio"));
  back.setAttribute("aria-hidden","true");
  if(countryName){
    back.style.setProperty("--wash",FLAG_WASH[norm(countryName)]||"#1F4E3D");
  }else{
    DATA.meta.countries.forEach(function(c){
      back.appendChild(countryMark(c.name,""));
    });
  }
  host.insertBefore(back,host.firstChild);
}
function clearBackdrop(host){
  var old=host.querySelector(":scope > .flagback");
  if(old) old.parentNode.removeChild(old);
  host.classList.remove("hasback");
}
function setPlate(countryName){
  var box=el("flagplate");
  clear(box);
  if(!countryName){ box.hidden=true; return; }
  box.appendChild(countryMark(countryName,""));
  box.hidden=false;
}

/* only http and https survive, so a malformed cell cannot become a script link */
function safeUrl(u){
  u=txt(u).trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u="https://"+u.replace(/^\/+/,"");
  try{
    var p=new URL(u);
    return (p.protocol==="http:" || p.protocol==="https:") ? p.href : "";
  }catch(e){ return ""; }
}
function safeMail(m){
  m=txt(m).trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m) ? m : "";
}
function safeTel(t){ t=txt(t).trim(); return /[0-9]/.test(t) ? t : ""; }

/* ---------- level 1 ---------- */
function buildL1(){
  var doors=el("doors");
  paintBackdrop(document.querySelector("header.top"),null);
  DATA.meta.countries.forEach(function(c){
    var a=make("a","door");
    a.href="#/c/"+slug(c.name);
    a.appendChild(countryMark(c.name));
    a.appendChild(make("span","nm",c.name));
    doors.appendChild(a);
  });

  var ts=DATA.types, head=ts.slice(0,10), rest=ts.slice(10);
  /* No counts here. The categories are the thing being chosen, and a number beside
     each one only invited a comparison nobody is making at this point. */
  function rank(list,into){
    list.forEach(function(t){
      var li=document.createElement("li");
      var a=make("a");
      a.href="#/t/"+slug(t.name);
      a.appendChild(make("span","t",t.name));
      li.appendChild(a);
      into.appendChild(li);
    });
  }
  rank(head,el("types"));
  if(rest.length){
    el("moresum").textContent="More kinds of funder";
    rank(rest,el("types-rest"));
  }else{
    el("moretypes").hidden=true;
  }
}

/* ---------- filtering ---------- */
var SEARCH_FIELDS=["name","type","country","city","area","focus","contact","title"];
var VISIBLE_FIELDS=["name"];   /* only the name shows while a row is closed */

function buildNorm(){
  NORM=new Map();
  ROWS.forEach(function(r){
    NORM.set(r,{
      all: norm(SEARCH_FIELDS.map(function(k){ return val(r,k); }).join(" ")),
      nm:  norm(val(r,"name"))
    });
  });
}
function matchRow(r,q){
  if(!q) return true;
  var n=NORM.get(r);
  return n ? n.all.indexOf(q)>-1 : false;
}
/* A closed row shows only its name, so any match that is not in the name is
   invisible. Those rows open themselves, otherwise a hit reads as a mystery. */
function matchedOutsideName(r,q){
  if(!q) return false;
  var n=NORM.get(r);
  return n ? n.nm.indexOf(q)===-1 : false;
}

function readControls(){
  return {
    q: norm(el("q").value),
    pick: el("pickwrap").hidden ? "" : el("pick").value,
    email: el("f-email").checked,
    phone: el("f-phone").checked,
    website: el("f-website").checked
  };
}
function computeFiltered(sel,c){
  var field=(sel.kind==="c") ? "city" : "country";
  var out=sel.rows.filter(function(r){
    if(c.pick && val(r,field)!==c.pick) return false;
    if(c.email && !val(r,"email")) return false;
    if(c.phone && !val(r,"phone")) return false;
    if(c.website && !val(r,"website")) return false;
    return matchRow(r,c.q);
  });
  /* Alphabetical by name, always. The review found the order was otherwise an
     accident of spreadsheet order, alphabetical inside a country view but grouped
     by city in a type view, which makes a name hard to find across 35 pages. */
  out.sort(function(a,b){
    return val(a,"name").localeCompare(val(b,"name"),"en",{sensitivity:"base"});
  });
  return out;
}
function apply(resetPage){
  if(!current) return;
  if(resetPage!==false) page=1;
  filtered=computeFiltered(current,readControls());
  render();
  writeHash(true);
}

/* ---------- one record ---------- */
function routesFor(r){
  var box=make("div","routes");
  var w=safeUrl(val(r,"website")), m=safeMail(val(r,"email"));
  var t=safeTel(val(r,"phone")), l=safeUrl(val(r,"linkedin"));
  function line(a,extra){
    var row=make("div","r");
    row.appendChild(a);
    if(extra) row.appendChild(extra);
    box.appendChild(row);
  }
  function link(href,label,external){
    var a=make("a",null,label);
    a.href=href;
    if(external){ a.target="_blank"; a.rel="noopener noreferrer"; }
    return a;
  }
  if(m){
    var cp=make("button","copy","Copy");
    cp.type="button";
    cp.setAttribute("data-copy",m);
    cp.setAttribute("aria-label","Copy the email address for "+val(r,"name"));
    line(link("mailto:"+m,m,false),cp);
  }
  if(t) line(link("tel:"+t.replace(/[^0-9+]/g,""),t,false));
  /* the label reads Website, never the raw address */
  if(w) line(link(w,"Website",true));
  if(l) line(link(l,"LinkedIn",true));
  if(!box.firstChild) box.appendChild(make("span","none","No contact published in the source"));
  return box;
}

function pairsFor(r){
  var dl=make("dl","rec-dl");
  function pair(label,node){
    if(!node) return;
    dl.appendChild(make("dt",null,label));
    var dd=make("dd");
    dd.appendChild(node);
    dl.appendChild(dd);
  }
  var focus=val(r,"focus");
  if(focus) pair("What they fund",document.createTextNode(focus));
  pair("Kind of funder",document.createTextNode(val(r,"type")));
  var where=[val(r,"city"),val(r,"country")].filter(Boolean).join(", ");
  var area=val(r,"area");
  if(area && area!==val(r,"city")) where=where ? where+" ("+area+")" : area;
  if(where) pair("Where",document.createTextNode(where));
  var who=val(r,"contact"), title=val(r,"title");
  if(who) pair("Named contact",document.createTextNode(who+(title ? ", "+title : "")));
  pair("Contact",routesFor(r));
  return dl;
}

function recFor(r,i,openIt){
  var id="p"+seq+"-"+i;
  var li=make("li","rec");
  var btn=make("button","rowbtn");
  btn.type="button";
  btn.setAttribute("aria-expanded",openIt ? "true" : "false");
  btn.setAttribute("aria-controls",id);
  btn.appendChild(make("span","nm",val(r,"name")));
  btn.appendChild(make("span","caret"));
  li.appendChild(btn);
  var panel=make("div","panel");
  panel.id=id;
  panel.hidden=!openIt;
  panel.appendChild(pairsFor(r));
  li.appendChild(panel);
  return li;
}

/* ---------- pagination ---------- */
function pageCount(){ return Math.max(1,Math.ceil(filtered.length/PER_PAGE)); }

/* Google's shape: previous, a short window of numbers with the first and last always
   reachable, then next. Nine slots at most, so it never wraps on a phone. */
function pageWindow(cur,total){
  var out=[], i;
  if(total<=5){
    for(i=1;i<=total;i++) out.push(i);
    return out;
  }
  /* At most seven slots INCLUDING the two gaps, so with Previous and Next the row is
     nine controls and still fits 375px. The earlier budget counted only the numbers
     and produced eleven. */
  var from=Math.max(2,cur-1), to=Math.min(total-1,cur+1);
  if(cur<=3){ from=2; to=3; }
  if(cur>=total-2){ from=total-2; to=total-1; }
  out.push(1);
  if(from>2) out.push("gap");
  for(i=from;i<=to;i++) out.push(i);
  if(to<total-1) out.push("gap");
  out.push(total);
  return out;
}
function buildPager(){
  var nav=el("pager");
  clear(nav);
  var total=pageCount();
  if(filtered.length<=PER_PAGE){ nav.hidden=true; return; }
  nav.hidden=false;
  function step(long,short,target,enabled,cls){
    var n=enabled ? make("a",cls) : make("span",cls+" off");
    if(enabled){
      n.href=hashFor(target);
      n.setAttribute("data-page",target);
    }
    /* both labels ship and CSS picks one, so the short form on a phone never changes
       the accessible name */
    n.setAttribute("aria-label",long+" page");
    n.appendChild(make("span","pg-lg",long));
    n.appendChild(make("span","pg-sm",short));
    nav.appendChild(n);
  }
  step("Previous","Prev",page-1,page>1,"edge");
  pageWindow(page,total).forEach(function(p){
    if(p==="gap"){ nav.appendChild(make("span","gap","...")); return; }
    if(p===page){
      var on=make("span","on",num(p));
      on.setAttribute("aria-current","page");
      nav.appendChild(on);
      return;
    }
    var a=make("a",null,num(p));
    a.href=hashFor(p);
    a.setAttribute("data-page",p);
    a.setAttribute("aria-label","Page "+p);
    nav.appendChild(a);
  });
  step("Next","Next",page+1,page<total,"edge");
}

function render(){
  if(!current) return;
  var total=pageCount();
  if(page>total) page=total;
  if(page<1) page=1;
  var c=readControls();
  var start=(page-1)*PER_PAGE;
  var slice=filtered.slice(start,start+PER_PAGE);
  seq++;
  var list=el("recs");
  clear(list);
  var frag=document.createDocumentFragment();
  slice.forEach(function(r,k){
    frag.appendChild(recFor(r,start+k,matchedOutsideName(r,c.q)));
  });
  list.appendChild(frag);

  if(filtered.length){
    el("tally").hidden=false;
    el("tally").textContent="Showing "+num(start+1)+" to "+num(start+slice.length)
      + " of "+plural(filtered.length,"organisation","organisations")
      + (filtered.length!==current.rows.length
          ? ", filtered from "+num(current.rows.length) : "");
    el("empty").hidden=true;
  }else{
    el("tally").hidden=true;
    el("emptymsg").textContent="Nothing in "+current.name+" matches that.";
    el("empty").hidden=false;
  }
  buildPager();
}

/* ---------- the second filter, which depends on the level-1 choice ---------- */
function fillPick(sel){
  var wrap=el("pickwrap"), sl=el("pick");
  clear(sl);
  var field=(sel.kind==="c") ? "city" : "country";
  var counts={};
  sel.rows.forEach(function(r){
    var v=val(r,field);
    if(v) counts[v]=(counts[v]||0)+1;
  });
  var names=Object.keys(counts).sort(function(a,b){
    return counts[b]-counts[a] || a.localeCompare(b);
  });
  if(!names.length){ wrap.hidden=true; return; }
  el("picklabel").textContent=(sel.kind==="c") ? "City" : "Country";
  var all=make("option",null,(sel.kind==="c")
    ? "All cities ("+num(sel.rows.length)+")"
    : "All countries ("+num(sel.rows.length)+")");
  all.value="";
  sl.appendChild(all);
  names.forEach(function(n){
    var o=make("option",null,n+" ("+num(counts[n])+")");
    o.value=n;
    sl.appendChild(o);
  });
  wrap.hidden=false;
}

/* ---------- routing ---------- */
var SLUGS={c:{},t:{}};
function buildSlugs(){
  function add(kind,list){
    list.forEach(function(item){
      var s=slug(item.name);
      if(SLUGS[kind][s]){
        console.warn("duplicate slug "+kind+"/"+s);
        return;
      }
      SLUGS[kind][s]=item;
    });
  }
  add("c",DATA.meta.countries);
  add("t",DATA.types);
}
function select(kind,s){
  var item=SLUGS[kind][s];
  if(!item) return null;
  var field=(kind==="c") ? "country" : "type";
  var list=ROWS.filter(function(r){ return val(r,field)===item.name; });
  var keys={}, sub;
  if(kind==="c"){
    list.forEach(function(r){ var v=val(r,"city"); if(v) keys[v]=1; });
    sub=plural(list.length,"organisation","organisations")+" in "
      + plural(Object.keys(keys).length,"city","cities");
  }else{
    list.forEach(function(r){ keys[val(r,"country")]=1; });
    sub=plural(list.length,"organisation","organisations")+" in "
      + plural(Object.keys(keys).length,"country","countries");
  }
  return {kind:kind,slug:s,name:item.name,sub:sub,rows:list};
}

function hashFor(targetPage){
  var c=readControls(), p=[];
  if(c.q) p.push("q="+encodeURIComponent(el("q").value.trim()));
  if(c.pick) p.push("in="+encodeURIComponent(c.pick));
  var has=["email","phone","website"].filter(function(k){ return c[k]; });
  if(has.length) p.push("has="+has.join(","));
  if(targetPage && targetPage>1) p.push("p="+targetPage);
  return "#/"+current.kind+"/"+current.slug+(p.length ? "?"+p.join("&") : "");
}
function writeHash(replace){
  if(!current) return;
  var h=hashFor(page);
  if(location.hash===h) return;
  writing=true;
  if(replace && history.replaceState) history.replaceState(null,"",h);
  else location.hash=h;
  setTimeout(function(){ writing=false; },0);
}

function parseQuery(qs){
  var p={};
  qs.split("&").forEach(function(kv){
    if(!kv) return;
    var eq=kv.indexOf("="), k=eq<0 ? kv : kv.slice(0,eq);
    var v=eq<0 ? "" : kv.slice(eq+1);
    try{ p[k]=decodeURIComponent(v.replace(/\+/g," ")); }
    catch(e){ p[k]=v; }
  });
  return p;
}

function route(){
  if(writing) return;
  clearTimeout(timer);
  var raw=location.hash.replace(/^#\/?/,"");
  if(!raw){ showL1(false); return; }
  var qs="", i=raw.indexOf("?");
  if(i>-1){ qs=raw.slice(i+1); raw=raw.slice(0,i); }
  var parts=raw.split("/").filter(Boolean);
  var kind=(parts[0]||"").toLowerCase(), s;
  try{ s=slug(decodeURIComponent(parts[1]||"")); }
  catch(e){ s=slug(parts[1]||""); }
  if((kind!=="c" && kind!=="t") || !s){ showL1(true); return; }
  var sel=select(kind,s);
  if(!sel){ showL1(true); return; }

  var sameSelection = current && current.kind===sel.kind && current.slug===sel.slug;
  current=sel;
  var p=parseQuery(qs);

  el("q").value=p.q||"";
  fillPick(sel);
  var want=p["in"]||"";
  var ok=false, opts=el("pick").options, j;
  for(j=0;j<opts.length;j++) if(opts[j].value===want){ ok=true; break; }
  el("pick").value = ok ? want : "";
  var has=(p.has||"").split(",");
  el("f-email").checked=has.indexOf("email")>-1;
  el("f-phone").checked=has.indexOf("phone")>-1;
  el("f-website").checked=has.indexOf("website")>-1;
  page=Math.max(1,parseInt(p.p,10)||1);

  el("l1").hidden=true;
  el("l2").hidden=false;
  if(sel.kind==="c"){ paintBackdrop(el("l2"),sel.name); setPlate(sel.name); }
  else { clearBackdrop(el("l2")); setPlate(null); }
  el("selname").textContent=sel.name;
  el("selsub").textContent=sel.sub;
  document.title=sel.name+" | Gulf Cooperation Council (GCC) Philanthropy, Donors and Funders";
  filtered=computeFiltered(sel,readControls());
  render();
  /* render() may have clamped the page, and a stale "in" may have been dropped, so
     the URL is rewritten to state what is actually on screen. Without this,
     ?p=999 showed page 35 and ?in=Nope showed no filter while both stayed in the
     address bar, and a copied link misrepresented the view. */
  if(location.hash!==hashFor(page)) writeHash(true);
  window.scrollTo(0,0);
  /* moving focus on every paging click would fight the reader, so the heading is
     only announced when the selection itself changes */
  if(!sameSelection) el("selname").focus();
}

function showL1(clean){
  clearTimeout(timer);
  current=null;
  filtered=[];
  page=1;
  el("l2").hidden=true;
  el("l1").hidden=false;
  document.title="Gulf Cooperation Council (GCC) Philanthropy, Donors and Funders";
  if(clean && history.replaceState){
    history.replaceState(null,"",location.pathname+location.search);
  }
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
function onSearch(){
  clearTimeout(timer);
  var owner=current;
  timer=setTimeout(function(){
    if(current===owner) apply(true);
  },180);
}

function wire(){
  el("q").addEventListener("input",onSearch);
  el("pick").addEventListener("change",function(){ apply(true); });
  ["f-email","f-phone","f-website"].forEach(function(id){
    el(id).addEventListener("change",function(){ apply(true); });
  });
  el("clearall").addEventListener("click",function(){
    el("q").value="";
    el("pick").value="";
    el("f-email").checked=false;
    el("f-phone").checked=false;
    el("f-website").checked=false;
    apply(true);
  });
  /* Handle a pager click from the LIVE controls. The href was written when the pager
     was built, so on its own it would restore whatever the search box held at that
     moment and discard anything typed since. */
  el("pager").addEventListener("click",function(e){
    if(!e.target.closest) return;
    var a=e.target.closest("a[data-page]");
    if(!a || !current) return;
    e.preventDefault();
    clearTimeout(timer);
    page=Math.max(1,parseInt(a.getAttribute("data-page"),10)||1);
    filtered=computeFiltered(current,readControls());
    render();
    writeHash(false);
    window.scrollTo(0,0);
  });
  el("home").addEventListener("click",function(e){
    e.preventDefault();
    if(location.hash){ location.hash=""; }
    else { showL1(true); }
  });
  el("back").addEventListener("click",function(e){
    e.preventDefault();
    if(location.hash){ location.hash=""; }
    else { showL1(true); }
  });
  /* one delegated listener for the whole list, however long it grows */
  el("recs").addEventListener("click",function(e){
    if(!e.target.closest) return;
    var btn=e.target.closest(".rowbtn");
    if(btn){
      var panel=document.getElementById(btn.getAttribute("aria-controls"));
      var open=btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded",open ? "false" : "true");
      if(panel) panel.hidden=open;
      return;
    }
    var cp=e.target.closest(".copy");
    if(cp){
      var v=cp.getAttribute("data-copy");
      var done=function(ok){
        cp.textContent = ok ? "Copied" : "Select it";
        setTimeout(function(){ cp.textContent="Copy"; },1800);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(v).then(function(){ done(true); },
                                             function(){ done(false); });
      }else{
        done(false);
      }
    }
  });
  window.addEventListener("hashchange",route);
}

/* ---------- boot ---------- */
function fail(msg){
  var s=el("state");
  clear(s);
  s.hidden=false;
  s.appendChild(document.createTextNode(msg));
  var b=make("button",null,"Try again");
  b.type="button";
  b.addEventListener("click",function(){ location.reload(); });
  s.appendChild(b);
}

fetch("data.json",{cache:"no-cache"}).then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(d){
  if(!d || !d.rows || !d.keys || !d.meta) throw new Error("malformed data");
  DATA=d;
  F={};
  var seen={};
  d.keys.forEach(function(k,i){
    if(seen[k]) throw new Error("duplicate column key: "+k);
    seen[k]=1;
    F[k]=i;
  });
  var missing=REQUIRED.filter(function(k){ return F[k]===undefined; });
  if(missing.length) throw new Error("missing columns: "+missing.join(", "));
  var n=d.keys.length, bad=0;
  ROWS=d.rows.filter(function(r){
    if(!Array.isArray(r) || r.length!==n){ bad++; return false; }
    return true;
  });
  if(bad) console.warn("skipped "+bad+" rows whose length did not match keys");
  if(!ROWS.length) throw new Error("no usable rows");
  buildNorm();
  buildSlugs();
  el("state").hidden=true;
  buildL1();
  wire();
  route();
}).catch(function(e){
  fail("The register could not be loaded ("+e.message+"). ");
});
})();
</script>
</body>
</html>
