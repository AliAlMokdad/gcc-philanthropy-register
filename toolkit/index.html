/* ============================================================================
   GCC PHILANTHROPY TOOLKIT, prototype.
   Structure measured from careemergencytoolkit.org: container 1140, rail 285 beside
   the content, one notched white sheet on a tinted ground, breadcrumb above it,
   numbered uppercase article titles at 28px, dense body type.
   Colours are Ali's own tokens. None of the reference's palette is used.
   ========================================================================= */
:root{
  --ink:#171A2B; --ink-2:#3B4468; --ink-3:#5B6488;
  --accent:#3E4CC4; --accent-2:#3341A6; --accent-soft:#E9EDFB; --accent-line:#CFD8F4;
  --paper:#F5F8FD; --paper-2:#EBF1FB; --line:#DEE7F4; --line-2:#CBD8EC;
  --focus:#3E4CC4; --mast:#232C5C;
  --slate:#3E4CC4; --slate-soft:#E8ECF3;   /* aligned to the canonical accent */
  --ground:#E6ECF6; --card:#FFFFFF;
  --on-slate:#FFFFFF;   /* text ON slate, which inverts between themes */
  --on-accent:#FFFFFF;  /* text ON accent, same reason */
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --orange:#A55A12; --orange-line:#E2853A; --orange-soft:rgba(226,133,58,.13);
  --orange-strong:#8A4A0E; --on-orange:#FFF8F1; --field-line:#7F8CAE;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:48px;
  --rail:285px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#EEF0F6; --ink-2:#C2C8DA; --ink-3:#9AA2B8;
    --accent:#AAB4F0; --accent-2:#C4CCF6; --accent-soft:#1C2138; --accent-line:#343B5C;
    --paper:#0E1018; --paper-2:#161A26; --line:#282E40; --line-2:#38405C;
    --focus:#AAB4F0; --mast:#1A2140;
    --slate:#9AA6C6; --slate-soft:#262C3C;
    --orange:#E8A55A; --orange-line:#E2853A; --orange-soft:rgba(226,133,58,.16);
    --orange-strong:#EDAA55; --on-orange:#26160A; --field-line:#66719C;
    --ground:#0A0C12; --card:#171B27;
    --on-slate:#0E1018; --on-accent:#0E1018;
  }
}

header.top{background:var(--mast);position:relative}
/* THE MASTHEAD IS THE SAME OBJECT ON EVERY SURFACE. This one was a hero: the site name at up to
   44px over 86px of padding, against 20px over 24px on the register and the news desk. Two sizes
   of the same words, one line apart in a reader's journey, is most of why the toolkit felt like a
   different property. It matches now, and what makes this page itself is the orange tab and the
   section nav underneath. */
header.top .container{padding-top:var(--s4);padding-bottom:var(--s4)}
/* the same move as the register: these styled the brand, so they follow it to .brandline */
header.top .brandline{margin:0;font:600 20px/1.25 var(--display);
  color:#F6F5F2;letter-spacing:0;text-wrap:balance}
header.top .brandline a.home{color:inherit;text-decoration:none}
header.top .brandline a.home:hover .abbr{color:#D6DCF4}
header.top .brandline a.home:focus-visible{outline:2px solid #C6CFE4;outline-offset:4px}
header.top .brandline .abbr{color:#B8C2E8;font-weight:400;transition:color .14s ease-out}

/* THE TAB MOVES TO THE RIGHT EDGE. It hung centred at the bottom of the masthead, which worked
   while the masthead was an 86px hero and collided with the member-state strip the moment that
   masthead became the same 24px object as everywhere else. On the right it clears the strip, which
   is left-aligned and short, and it still reads as a tab on the band's lower edge. */
/* THE STRIP CANNOT RUN UNDER THE TAB. Their boxes overlap and only the shortness of the current
   member-state list keeps the ink apart, which is the kind of thing that holds until someone adds
   a word. The strip now reserves the tab's width, so the two can never meet. */
header.top .kick{padding-right:200px}   /* room for the shared .pagetab */
@media (max-width:760px){ header.top .kick{padding-right:0} }

.doc-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:baseline;

h1.doc-t::after{content:"";display:block;width:132px;height:4px;border-radius:2px;

  text-transform:uppercase;color:var(--accent)}
/* SUPPRESSED FOR :focus, RESTORED FOR :focus-visible. The article renderer moves focus to this
   heading with .focus(), and with the indicator removed outright a keyboard reader lost all
   trace of where they were. :focus still fires on a script-driven move after a mouse click, so
   the ring stays off there; :focus-visible is what the browser matches when the user is actually
   navigating by keyboard, which is exactly when the ring is needed. */
h1.doc-t:focus{outline:none}

     pick:function(n){ return n.volume==="Impact, stewardship and learning"; }},
    {id:"gcc",name:"The GCC",
     pick:function(n){ return n.family==="jurisdictional" && has(n,"GCC-wide"); }},
    {id:"qatar",name:"Qatar",  pick:function(n){ return has(n,"Qatar"); }},
    {id:"saudi",name:"Saudi Arabia", pick:function(n){ return has(n,"Saudi Arabia"); }},
    {id:"uae",name:"United Arab Emirates",
     pick:function(n){ return has(n,"United Arab Emirates"); }},
    {id:"dubai",name:"Dubai", pick:function(n){ return has(n,"Dubai"); }}
  ];

  /* the thematic half of SECDEF, named once so the landing can tell the two axes apart without a
     second list to keep in sync */
  var THEME_IDS=["foundations","regulation","capital","impact"];

  /* THE CATALOG, NOT THE CORPUS. notes.json is 279KB and was fetched before the router had even
     decided which paper you asked for, so opening one 7KB paper downloaded all thirty-five. That
     was tolerable while the toolkit was reached through its own landing page; the country hubs now
     link straight to individual papers from six member pages, so the deep link is the common path.
     The catalog carries everything the landing page, the section lists and the router need, at
     8.5KB over the wire. A paper's body arrives when that paper is opened, and the full corpus only
     when someone types in the search box, because search reads every word of every paper and that
     is worth keeping exactly as it was. */
  fetch("catalog.json").then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){ DATA=j; boot(); }).catch(function(e){
    EL("sheet").appendChild(el("p",{cls:"empty",
      text:"The toolkit content could not be loaded. "+(e&&e.message||"")}));
  });

  /* the body of one paper, fetched once and kept on the note */
  var bodyPending={};
  function ensureBody(n){
    if(!n) return Promise.resolve(false);
    if(n.sections) return Promise.resolve(true);
    if(bodyPending[n.slug]) return bodyPending[n.slug];
    bodyPending[n.slug]=fetch("papers/"+encodeURIComponent(n.slug)+".json").then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(b){
      n.sections=b.sections||[];
      n.refs=b.refs||[];
      return true;
    }).catch(function(e){
      delete bodyPending[n.slug];
      console.warn("paper body unavailable: "+n.slug+" ("+e.message+")");
      return false;
    });
    return bodyPending[n.slug];
  }

  /* the whole corpus, for search only. Search matches on every word of every paper, so it needs
     what the catalog leaves out. Fetched once, on the first keystroke, never on arrival. */
  var corpusPending=null;
  function ensureCorpus(){
    if(DATA._corpus) return Promise.resolve(true);
    if(corpusPending) return corpusPending;
    corpusPending=fetch("notes.json").then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(j){
      var by={};
      (j.notes||[]).forEach(function(n){ by[n.slug]=n; });
      DATA.notes.forEach(function(n){
        var full=by[n.slug];
        if(full){
          if(!n.sections) n.sections=full.sections||[];
          if(!n.refs) n.refs=full.refs||[];
        }
        indexNote(n);
      });
      DATA._corpus=true;
      return true;
    }).catch(function(e){
      corpusPending=null;
      console.warn("search index unavailable: "+e.message);
      return false;
    });
    return corpusPending;
  }

  /* STRONG and HAY, built for one note. Called for every note once the corpus is in, and at boot
     with only what the catalog holds, so a title match works before search has loaded anything. */
  function indexNote(n){
    var heads=[], body=[];
    (n.sections||[]).forEach(function(x){
      heads.push(x.heading||"");
      (x.paras||[]).forEach(function(p){ body.push(p); });
      if(x.table) (x.table.rows||[]).forEach(function(r){ body.push(r.join(" ")); });
    });
    n._strong=norm([n.title,(n.keywords||[]).join(" "),heads.join(" ")].join(" "));
    n._hay=norm([n._strong,n.abstract||"",body.join(" "),
      (n.refs||[]).map(function(r){ return r.text; }).join(" ")].join(" "));
  }

  function boot(){
    DATA.notes.forEach(function(n){
      BY_SLUG[n.slug]=n;
      /* indexed here with only what the catalog holds, so a title or keyword match works before
         search has fetched anything, and indexed again against the full body once it has */
      indexNote(n);
    });
    SECDEF.forEach(function(d){
      var arr=DATA.notes.filter(d.pick);
      if(arr.length) SECTIONS.push({id:d.id,name:d.name,notes:arr});
    });
    /* every article must be reachable from at least one section, or the tree hides part of the
       collection. Multiple placements are allowed and intended; zero placements is a bug. */
    var placed={};
    SECTIONS.forEach(function(s){ s.notes.forEach(function(n){ placed[n.id]=1; }); });
    var unplaced=DATA.notes.filter(function(n){ return !placed[n.id]; });
    if(unplaced.length) console.warn("unreachable articles: "+unplaced.map(function(n){return n.id;}));
    buildNav();
    window.addEventListener("hashchange",route);
    route();
  }

  function buildNav(){
    var host=EL("secnav"); clear(host);
    var row=el("div",{cls:"secrow"});
    SECTIONS.forEach(function(s){
      row.appendChild(el("a",{href:"#/"+s.id,text:s.name,"data-sec":s.id}));
    });
    host.appendChild(row);
    var f=el("div",{cls:"find"});
    f.appendChild(el("label",{cls:"sr",for:"q",text:"Search the toolkit"}));
    var i=el("input",{id:"q",type:"search",autocomplete:"off",spellcheck:"false",
      maxlength:"120",placeholder:"Search the toolkit"});
    /* THE FIRST KEYSTROKE FETCHES THE CORPUS, and searching waits for it rather than answering
       from the catalog and then changing its mind. Search reads every word of every paper, so a
       partial index would return fewer results and then more, under the reader, which reads as the
       site being unsure. One short wait on the first search only; after that it is in memory.
       If the corpus cannot be fetched, the search still runs against titles, keywords and
       abstracts, which is what the catalog holds, rather than returning nothing. */
    i.addEventListener("input",function(){
      var v=i.value;
      if(!v.trim()){ route(); return; }
      ensureCorpus().then(function(){
        if(i.value!==v) return;        /* they typed on; that keystroke owns the next render */
        showSearch(i.value);
      });
    });
    i.addEventListener("keydown",function(e){
      if(e.key==="Escape" && i.value){ i.value=""; route(); }
    });
    f.appendChild(i);
    host.appendChild(f);
  }
  function markNav(id){
    [].forEach.call(document.querySelectorAll("#secnav a"),function(a){
      if(id && a.getAttribute("data-sec")===id) a.setAttribute("aria-current","true");
      else a.removeAttribute("aria-current");
    });
  }

  function route(){
    var h=location.hash.replace(/^#\/?/,"");
    var parts=h.split("/").filter(Boolean);
    var q=EL("q"); if(q && q.value.trim()) q.value="";
    if(!parts.length){ showHome(); return; }
    var sec=SECTIONS.filter(function(s){ return s.id===parts[0]; })[0];
    if(!sec){ showHome(); return; }
    var art=parts[1] && BY_SLUG[parts[1]];
    if(art){
      /* the body arrives before the paper is drawn, or showArticle would read n.sections on a note
         that only carries its catalog entry. A miss renders the section instead of a blank sheet. */
      var target=sec.notes.indexOf(art)>=0 ? sec
        : (SECTIONS.filter(function(s2){ return s2.notes.indexOf(art)>=0; })[0] || null);
      var want=location.hash;
      ensureBody(art).then(function(ok){
        if(location.hash!==want) return;      /* the reader moved on while it was in flight */
        if(ok && target) showArticle(target,art);
        else showSection(sec);
      });
      return;
    }
    showSection(sec);
  }

  function crumbs(items){
    var c=EL("crumb"); clear(c);
    items.forEach(function(it,i){
      if(i) c.appendChild(el("span",{cls:"sep",text:"»"}));
      if(it.href) c.appendChild(el("a",{href:it.href,text:it.text}));
      else c.appendChild(document.createTextNode(it.text));
    });
  }
  function sheet(solo){
    var h=EL("sheet"); clear(h);
    h.className = solo ? "sheet-in solo" : "sheet-in";
    return h;
  }
  function mins(n){ return n.minutes+(n.minutes===1?" minute read":" minutes read"); }

  /* A TABLE OF CONTENTS, on request. The four front-matter paragraphs are gone from this page:
     a reader arriving here now sees titles and clicks one to reach that section's list, which is
     what Ali asked for. Nothing but titles, so no abstracts and no read times either; those
     already live one level down where the articles are.

     The paragraphs are removed from the RENDER and NOT from notes.json. DATA.guide still holds
     his own standard, purpose, nature and accuracy text, so nothing he wrote has been destroyed
     and any of it goes back by restoring one line. Deleting an author's source text in order to
     hide it from a page is the wrong trade. */
  /* THE LANDING SHOWS THE SHAPE OF THE COLLECTION, WHICH HAS TWO AXES AND NOT NINE SECTIONS.
     SECDEF above defines four thematic volumes and five jurisdictions, and the jurisdictional ones
     RE-CUT the same papers rather than adding new ones: an article about entering Qatar, Saudi
     Arabia and the UAE genuinely belongs to all three. Listing all nine as "01" through "09" said
     the opposite. It implied a sequence, so a reader could reasonably add the counts and conclude
     the collection is twice the size it is. That was the real fault on this page, not its styling.

     So the axes are separated and labelled, the numbering is gone, and the only numbers here are
     counts, which mean something. Colour follows the register's rule exactly: GREEN IS GEOGRAPHY,
     and TOPIC HAS NO COLOUR because it is carried by its words. That is why the thematic list is
     unpainted and the jurisdictional one is not.

     Every figure is counted from notes.json when the page loads. Nothing here is written down. */
  function axisList(defs, cls){
    var ol=el("ol",{cls:"axis "+cls});
    defs.forEach(function(sec){
      var a=el("a",{href:"#/"+sec.id});
      a.appendChild(el("span",{cls:"axis-t",text:sec.name}));
      var mins=sec.notes.reduce(function(t,n){ return t+(n.minutes||0); },0);
      var meta=el("span",{cls:"axis-m"});
      meta.appendChild(el("b",{text:String(sec.notes.length)}));
      meta.appendChild(document.createTextNode(
        sec.notes.length===1 ? " paper" : " papers"));
      if(mins) meta.appendChild(el("i",{text:"  " + mins + " min"}));
      a.appendChild(meta);
      ol.appendChild(el("li",null,[a]));
    });
    return ol;
  }

  function showHome(){
    markNav(null);
    crumbs([]);
    document.title="Toolkit | Gulf Cooperation Council (GCC) Philanthropy";
    var host=sheet(true);
    var left=el("div",{cls:"home-col"});
    left.appendChild(el("h1",{cls:"home-h",text:"Toolkit"}));

    /* THE COLLECTION STATED IN ITS OWN NUMBERS, counted here rather than written down.
       84 minutes, not "about 1 hours": dividing by sixty and rounding turned an honest figure into
       a wrong one and an ungrammatical sentence at the same time. Minutes are what the data holds,
       so minutes are what it says. */
    var papers=DATA.notes.length;
    var refs=DATA.notes.reduce(function(t,n){ return t+(n.ref_count||(n.refs||[]).length||0); },0);
    var mins=DATA.notes.reduce(function(t,n){ return t+(n.minutes||0); },0);

    var themes=SECTIONS.filter(function(s){ return THEME_IDS.indexOf(s.id)>=0; });
    var places=SECTIONS.filter(function(s){ return THEME_IDS.indexOf(s.id)<0; });

    /* DISTINCT papers behind each axis, because the jurisdictional lists overlap each other: a
       paper covering three states is counted once here and appears three times below. Counting the
       rows instead would have claimed a collection larger than it is. */
    function distinct(list){
      var seen={}, n=0;
      list.forEach(function(sec){ sec.notes.forEach(function(a){
        if(!seen[a.id]){ seen[a.id]=1; n++; } }); });
      return n;
    }
    var byTheme=distinct(themes), byPlace=distinct(places);

    var lede=el("p",{cls:"home-lede"});
    lede.appendChild(el("b",{text:String(papers)}));
    lede.appendChild(document.createTextNode(" papers on philanthropy in the Gulf, "));
    lede.appendChild(el("b",{text:String(byTheme)}));
    lede.appendChild(document.createTextNode(" organised by theme and "));
    lede.appendChild(el("b",{text:String(byPlace)}));
    lede.appendChild(document.createTextNode(" by jurisdiction. "));
    lede.appendChild(el("b",{text:String(refs)}));
    lede.appendChild(document.createTextNode(" references, "));
    lede.appendChild(el("b",{text:String(mins)}));
    lede.appendChild(document.createTextNode(" minutes of reading."));
    left.appendChild(lede);

    left.appendChild(el("h2",{cls:"axis-h",text:"By theme"}));
    left.appendChild(axisList(themes,"axis-theme"));

    left.appendChild(el("h2",{cls:"axis-h",text:"By jurisdiction"}));
    /* THE SENTENCE THAT STOPS A READER ADDING THE ROWS UP, and it has taken two corrections.
       It first said these were the same papers read by country, which is false: the two axes are
       disjoint, 20 thematic and 15 jurisdictional, checked against the data rather than assumed.
       What DOES repeat is inside this axis, where a paper covering several states is listed under
       each of them. The second correction is "and their minutes": the sentence covered the paper
       count only, so a reader adding the minute column still got a number that did not reconcile.
       The rows here total 19 papers and 38 minutes against the 15 and 30 actually behind them, and
       the 84 in the lede is the whole collection of 35, not this axis. */
    left.appendChild(el("p",{cls:"axis-note",
      text:"A separate set of country papers. One covering several states is listed under each, "
         + "so these rows, and their minutes, add up to more than the " + byPlace
         + " papers behind them."}));
    left.appendChild(axisList(places,"axis-place"));

    host.appendChild(left);
    window.scrollTo(0,0);
  }

  /* styled here rather than in the sheet above, so the whole change to this page lives in one
     place and can be reverted in one edit */
  (function(){
    var st=document.createElement("style");
    st.textContent=
      /* .home-col centres a 76ch column, which suits prose but leaves a list of titles floating
         in the middle of a wide sheet, so on this page the column starts at the sheet's own
         left edge.

         THE ROW SPANS THE SHEET AND THE TEXT IS MEASURED, which is this page's existing
         convention, not a new one: ol.chapters sets no width at all and caps .ch-t at 62ch
         instead. Capping the ROW was the wrong half to cap. It stopped every hairline at 62%
         of the card and left the rest of the card empty, which reads as an unfinished layout
         rather than as a decision, and it made this landing the only list on the site whose
         rules stop short of the edge. */
      ".home-col:has(.home-toc){max-width:none;margin-inline:0}"+
      /* THE COLUMN IS THE LIST. .home-col centres a 76ch measure, which suits prose and leaves a
         short list floating in a wide sheet, so here it starts at the sheet's own left edge. The
         ROW spans it and the TEXT is measured, which is this page's existing convention: ol.chapters
         sets no width and caps .ch-t at 62ch instead. */
      ".home-col:has(.axis){max-width:none;margin-inline:0}"+

      ".home-lede{margin:var(--s3) 0 0;max-width:62ch;"+
        "font:400 17px/1.55 var(--sans);color:var(--ink-2)}"+
      ".home-lede b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}"+

      /* A GROUP HEADING, not a decorated one. Mono uppercase at label size is what this site uses
         for a structural label everywhere else, so the two axes are named in the site's own voice. */
      ".axis-h{margin:var(--s5) 0 0;font:600 11px/1.4 var(--mono);letter-spacing:.17em;"+
        "text-transform:uppercase;color:var(--ink-3)}"+
      ".axis-note{margin:10px 0 0;max-width:64ch;font:400 14.5px/1.55 var(--sans);"+
        "color:var(--ink-3)}"+

      ".axis{list-style:none;margin:var(--s3) 0 0;padding:0}"+
      ".axis li{border-top:1px solid var(--line)}"+
      ".axis li:last-child{border-bottom:1px solid var(--line)}"+
      ".axis a{display:flex;align-items:baseline;justify-content:space-between;gap:24px;"+
        "padding:16px 4px;text-decoration:none;color:var(--ink)}"+
      ".axis-t{font:600 clamp(17px,1.7vw,21px)/1.3 var(--serif);letter-spacing:-.01em;"+
        "max-width:52ch}"+
      /* the count is metadata, so it takes the metadata treatment and tabular figures, which keeps
         the column of numbers aligned down the list */
      ".axis-m{flex:none;font:400 13px/1.4 var(--mono);letter-spacing:.06em;color:var(--ink-3);"+
        "font-variant-numeric:tabular-nums;white-space:nowrap}"+
      ".axis-m b{font-weight:600;color:var(--ink-2)}"+
      /* the read time is information, so it takes a text colour. --line-2 is a hairline colour and
         measured 1.44:1 against the card, which is not readable by anyone. */
      ".axis-m i{font-style:normal;color:var(--ink-3)}"+

      /* GREEN IS GEOGRAPHY. It appears on the jurisdictional axis and nowhere else on this page,
         and the thematic axis carries no colour at all, because the register's rule is that a topic
         is carried by its words. That is the whole reason these two lists look different. */
      ".axis-place .axis-t{color:var(--i-country-ink,#1B5A50)}"+
      ".axis-place .axis-m b{color:var(--i-country-ink,#1B5A50)}"+

      ".axis a:hover{background:var(--accent-soft)}"+
      ".axis-theme a:hover .axis-t{color:var(--accent-2)}"+
      ".axis-place a:hover .axis-t{text-decoration:underline;text-underline-offset:3px}"+
      ".axis a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}"+
      "@media (max-width:600px){.axis a{flex-wrap:wrap;gap:4px}.axis-m{width:100%}}";
    document.head.appendChild(st);
  })();

  function showSection(sec){
    markNav(sec.id);
    crumbs([{text:"Toolkit",href:"#"},{text:sec.name}]);
    document.title=sec.name+" | Toolkit | Gulf Cooperation Council (GCC) Philanthropy";
    var host=sheet(true);
    var main=el("div");
    main.appendChild(el("h1",{cls:"doc-t",text:sec.name}));
    /* no blurb. A sentence of mine describing his section would be a word he did not write. */

      var a=el("a",{href:"#/"+sec.id+"/"+n.slug});

  function showArticle(sec,n){
    markNav(sec.id);
    crumbs([{text:"Toolkit",href:"#"},{text:sec.name,href:"#/"+sec.id},
            {text:n.title}]);
    document.title=n.title+" | Toolkit | Gulf Cooperation Council (GCC) Philanthropy";
    var host=sheet(false);
    host.appendChild(tree(sec,n));
    var main=el("div");

    /* the only metadata left is the read time and his own numbering. The Part, Jurisdiction,
       Procedure and Sources labels I had here were my words, so they are gone. */
    var meta=el("div",{cls:"doc-meta"});
    meta.appendChild(mark("dm-mark"));
    meta.appendChild(el("span",{text:mins(n)}));
    main.appendChild(meta);

    main.appendChild(el("h1",{cls:"doc-t",tabindex:"-1",text:n.title}));

    main.appendChild(el("p",{cls:"doc-lead",text:n.abstract}));

        n.keywords.map(function(k){ return el("i",{text:k}); })));
    }

    n.sections.forEach(function(s,i){
      if(s.heading==="References") return;
      var box=el("section",{cls:"doc-sec",id:"s"+i});
      /* HIS HEADING, and nothing above it. The slot labels that used to sit here, Framing and
         Evidence limits and Framework, were mine. */
      box.appendChild(el("h3",{cls:"doc-h",text:s.heading}));
      s.paras.forEach(function(p){ box.appendChild(el("p",{text:p})); });
      /* the framework keeps its table. Its header row read "Element | Operational question or
         action" identically on all 35, the one place the shared template was undisguised, so the
         header is dropped and his own heading captions it. */
      if(s.table) box.appendChild(fwTable(s.table));
      main.appendChild(box);
    });

    if(n.refs.length) main.appendChild(refs(n));
    host.appendChild(main);

  }

  function fwTable(tb){
    var t=el("table",{cls:"fw"}), body=el("tbody");
    (tb.rows||[]).forEach(function(r){
      var tr=el("tr");
      tr.appendChild(el("th",{scope:"row",text:r[0]||""}));
      tr.appendChild(el("td",{text:r[1]||""}));
      body.appendChild(tr);
    });
    t.appendChild(body);
    return t;
  }

  function refs(n){
    var box=el("section",{cls:"doc-refs",id:"refs"});
    /* HIS word: the heading in his document is References. */
    box.appendChild(el("h3",{text:"References"}));
    var ol=el("ol");
    n.refs.forEach(function(r){
      var li=el("li");
      var safe=r.url && safeUrl(r.url);
      if(safe && r.text.indexOf(r.url)>=0){
        var i=r.text.indexOf(r.url);
        li.appendChild(document.createTextNode(r.text.slice(0,i)));
        li.appendChild(el("a",{href:safe,rel:"noopener noreferrer",target:"_blank",text:r.url}));
        li.appendChild(document.createTextNode(r.text.slice(i+r.url.length)));
      } else li.textContent=r.text;
      ol.appendChild(li);
    });
    box.appendChild(ol);
    return box;
  }

  function tree(sec,current){
    var side=el("nav",{cls:"tree","aria-label":sec.name+" contents"});
    side.appendChild(el("p",{cls:"tree-h",text:sec.name}));
    var ol=el("ol");
    sec.notes.forEach(function(n){
      var li=el("li");
      var a=el("a",{href:"#/"+sec.id+"/"+n.slug,text:n.title});
      if(current && n===current) a.setAttribute("aria-current","true");
      li.appendChild(a);
      if(current && n===current){
        var subs=el("div",{cls:"subs"});
        n.sections.forEach(function(s,j){
          var target = s.heading==="References" ? "refs" : ("s"+j);
          /* his heading text, unchanged */
          var sa=el("a",{href:"#"+target,text:s.heading});
          sa.addEventListener("click",function(e){
            e.preventDefault();
            var t=document.getElementById(target);
            if(t) t.scrollIntoView({block:"start",behavior:"auto"});
          });
          subs.appendChild(sa);
        });
        li.appendChild(subs);
      }
      ol.appendChild(li);
    });
    side.appendChild(ol);
    return side;
  }

  function showSearch(q){
    markNav(null);
    crumbs([{text:"Toolkit",href:"#"},{text:"Search"}]);
    var host=sheet(true);
    var main=el("div");
    var words=norm(q).split(" ").filter(Boolean);
    var hits=[], seen={};
    /* nothing searchable in the query, so nothing can honestly be called a result */
    if(!words.length){
      main.appendChild(el("h2",{cls:"doc-t",text:"Search"}));
      main.appendChild(el("p",{cls:"empty",text:"Nothing matches "+q}));
      host.appendChild(main); return;
    }
    SECTIONS.forEach(function(s){
      s.notes.forEach(function(n){
        if(seen[n.id]) return;
        /* ANCHORED TO A WORD START, not anywhere in the string. indexOf matched a query inside
           any word, so "men" returned all 35 articles through government, engagement and
           management, and "art" and "ship" returned 32 each with no genuine hit. A leading space
           on both sides of the test pins the match to a word boundary on the left while still
           allowing a partial word on the right, so "gov" finds government and "men" does not. */
        if(!words.every(function(w){ return (" "+n._hay).indexOf(" "+w)>=0; })) return;
        var strong=0;
        words.forEach(function(w){ if(n._strong.indexOf(w)>=0) strong++; });
        seen[n.id]=1; hits.push({s:s,n:n,strong:strong});
      });
    });
    /* an article whose title or keywords carry the term comes before one that only mentions it */
    hits.sort(function(a,b){ return (b.strong-a.strong) || (a.n.id-b.n.id); });
    main.appendChild(el("h2",{cls:"doc-t",text:"Search"}));
    var ol=el("ol",{cls:"chapters"});
    hits.forEach(function(h){
      var a=el("a",{href:"#/"+h.s.id+"/"+h.n.slug});
      var gut=el("div",{cls:"ch-g"});
      gut.appendChild(mark("ch-n"));
      gut.appendChild(el("span",{cls:"ch-m",text:mins(h.n)}));
      a.appendChild(gut);
      var col=el("div");
      col.appendChild(el("h3",{cls:"ch-t",text:h.n.title}));
      col.appendChild(el("p",{cls:"ch-ab",text:h.n.abstract}));
      a.appendChild(col);
      ol.appendChild(el("li",null,[a]));
    });
    if(hits.length) main.appendChild(ol);
    else main.appendChild(el("p",{cls:"empty",text:"Nothing matches "+q}));
    host.appendChild(main);
  }
})();
</script>
