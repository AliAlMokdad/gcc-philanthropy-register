  <!-- Kuwait Towers -->
  <path d="M1132 420 L1138 232 L1142 232 L1148 420 Z" transform="translate(707.5,0)" />
  <circle cx="1140" cy="326" r="19" transform="translate(712.5,0)" />
  <path d="M1166 420 L1173 130 L1177 130 L1184 420 Z" transform="translate(728.75,0)" />
