<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 420" width="2600" height="420" role="presentation" aria-hidden="true">
<!--
  A Gulf skyline, drawn for this site rather than sourced.

  IT IS A MASK ASSET, NOT A PICTURE. The CSS paints it with a design token, which is why
  every shape here is white and why opening this file on its own looks blank. Painting it
  from a token is what makes it theme aware for nothing: dark mode inverts the colour
  without needing a second file.

  WHITE, NOT BLACK, DELIBERATELY. A CSS mask referencing an SVG file resolves as an alpha
  mask, and the vertical gradient below supplies that alpha. If any engine ever resolved
  it by luminance instead, black shapes would mask everything out and the band would
  silently vanish. White shapes with graded opacity read correctly under both, so that
  failure mode does not exist.

  THE GRADIENT IS THE FADE, and it is baked in here rather than composited in CSS.
  mask-composite:intersect degrades badly where it is unsupported: the two layers fall
  back to being added and the silhouette becomes a full width wash. One mask layer with
  the fade inside it cannot fail that way.

  THREE THINGS WERE WRONG IN THE FIRST VERSION and were only visible once it was
  rendered and looked at:
    A hairline dome arc behind the city crossed IN FRONT of the towers and read as a
    stray diagonal scratch, which at six per cent was the most noticeable thing in the
    band. Removed rather than softened.
    The Burj Khalifa was as wide as its neighbours and stepped too gently, so it read as
    a fat block. It is now genuinely narrow and rises well clear of everything, because
    a Gulf skyline without one dominant needle does not read as a Gulf skyline.
    The Bahrain turbines were stroked circles on a bar and looked like no entry signs.
    They are now a hub with three blades.

  Landmarks, left to right: an Omani fort, dome and watchtower, Doha's slim towers,
  Riyadh's Kingdom Centre arch and the Al Faisaliah spire, the Burj Khalifa, a faceted
  tower, the Bahrain World Trade Center sails with their bridge turbines, and the Kuwait
  Towers. Silhouette only, which is all that survives at six per cent anyway.
-->
<defs>
  <linearGradient id="fade" x1="0" y1="420" x2="0" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="1" />
    <stop offset=".45" stop-color="#fff" stop-opacity=".78" />
    <stop offset=".80" stop-color="#fff" stop-opacity=".36" />
    <stop offset="1" stop-color="#fff" stop-opacity=".14" />
  </linearGradient>
</defs>

<g fill="url(#fade)">

  <!-- Oman: fort, dome, watchtower -->
  <path d="M30 420 L30 366 L44 366 L44 354 L58 354 L58 366 L72 366 L72 354 L86 354            L86 366 L108 366 L108 420 Z" transform="translate(18.75,0)" />
  <path d="M112 420 Q112 384 142 384 Q172 384 172 420 Z" transform="translate(70.0,0)" />
  <path d="M186 420 L186 262 L204 262 L204 420 Z" transform="translate(116.25,0)" />
  <path d="M178 262 L212 262 L206 240 L184 240 Z" transform="translate(111.25,0)" />
  <path d="M193 240 L195 202 L197 202 L199 240 Z" transform="translate(120.62,0)" />

  <!-- Doha: a rounded slab and a tapered spire -->
  <path d="M234 420 L234 182 Q251 156 268 182 L268 420 Z" transform="translate(146.25,0)" />
  <path d="M249 156 L251 122 L253 122 L255 156 Z" transform="translate(155.62,0)" />
  <path d="M288 420 L300 196 L318 196 L330 420 Z" transform="translate(180.0,0)" />
  <path d="M307 196 L309 152 L311 152 L313 196 Z" transform="translate(191.88,0)" />

  <!-- Riyadh: the Kingdom Centre arch -->
  <path d="M352 420 L352 240 Q352 196 400 196 Q448 196 448 240 L448 420 L420 420            L420 268 Q420 236 400 236 Q380 236 380 268 L380 420 Z" transform="translate(220.0,0)" />

  <!-- Riyadh: Al Faisaliah, spire and sphere -->
  <path d="M466 420 L507 120 L548 420 Z" transform="translate(291.25,0)" />
  <circle cx="507" cy="198" r="21" transform="translate(316.88,0)" />

  <!-- low blocks stepping up to the hero -->
  <path d="M556 420 L556 344 L604 344 L604 420 Z" transform="translate(347.5,0)" />
  <path d="M596 420 L596 372 L626 372 L626 420 Z" transform="translate(372.5,0)" />

  <!-- Dubai: the Burj Khalifa. Narrow, and clear of everything else by design -->
  <path d="M626 420 L626 296 L634 296 L634 250 L641 250 L641 208 L647 208 L647 170            L652 170 L652 132 L656 132 L656 96 L658.5 96 L658.5 40 L659.5 40 L659.5 4            L660.5 4 L660.5 40 L661.5 40 L661.5 96 L664 96 L664 132 L668 132 L668 170            L673 170 L673 208 L679 208 L679 250 L686 250 L686 296 L694 296 L694 420 Z" transform="translate(391.25,0)" />

  <path d="M700 420 L700 340 L756 340 L756 420 Z" transform="translate(437.5,0)" />

  <!-- a tower with a raised central section, then a faceted wedge -->
  <path d="M764 420 L764 262 L776 262 L776 226 L800 226 L800 262 L812 262 L812 420 Z" transform="translate(477.5,0)" />
  <path d="M820 420 L820 244 L884 176 L884 420 Z" transform="translate(512.5,0)" />

  <!-- Bahrain World Trade Center: twin sails, three bridges, a turbine on each -->
  <path d="M896 420 Q896 246 920 196 Q932 250 934 420 Z" transform="translate(560.0,0)" />
  <path d="M952 420 Q952 246 976 196 Q988 250 990 420 Z" transform="translate(595.0,0)" />
  <path d="M934 245 L952 245 L952 248 L934 248 Z" transform="translate(583.75,0)" />
  <path d="M934 305 L952 305 L952 308 L934 308 Z" transform="translate(583.75,0)" />
  <path d="M934 365 L952 365 L952 368 L934 368 Z" transform="translate(583.75,0)" />
  <g stroke="url(#fade)" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(582.88,0)">
    <path d="M943 246 L943 234 M943 246 L932.6 252 M943 246 L953.4 252" />
    <path d="M943 306 L943 294 M943 306 L932.6 312 M943 306 L953.4 312" />
    <path d="M943 366 L943 354 M943 366 L932.6 372 M943 366 L953.4 372" />
  </g>
  <circle cx="943" cy="246" r="2.6" transform="translate(589.38,0)" />
  <circle cx="943" cy="306" r="2.6" transform="translate(589.38,0)" />
  <circle cx="943" cy="366" r="2.6" transform="translate(589.38,0)" />

  <path d="M1000 420 L1000 244 L1046 244 L1046 420 Z" transform="translate(625.0,0)" />
  <path d="M1054 420 L1054 286 L1066 286 L1066 266 L1080 266 L1080 286 L1092 286            L1092 420 Z" transform="translate(658.75,0)" />
