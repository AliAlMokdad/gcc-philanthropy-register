  <!-- the city carrying on to the right edge, so the band does not end on a landmark -->
  <path d="M1244 420 L1244 292 L1300 292 L1300 420 Z" transform="translate(777.5,0)" />
  <path d="M1308 420 L1308 248 L1344 248 L1344 420 Z" transform="translate(817.5,0)" />
  <path d="M1324 248 L1326 212 L1328 212 L1330 248 Z" transform="translate(827.5,0)" />
  <path d="M1352 420 L1352 306 L1418 306 L1418 420 Z" transform="translate(845.0,0)" />
  <path d="M1426 420 L1426 262 L1462 262 L1462 420 Z" transform="translate(891.25,0)" />
  <path d="M1470 420 L1470 328 L1534 328 L1534 420 Z" transform="translate(918.75,0)" />
  <path d="M1542 420 L1542 278 L1576 278 L1576 420 Z" transform="translate(963.75,0)" />

  <!-- three clouds, kept low enough that the fade does not erase them -->
  <g transform="translate(132.5,0)">
    <circle cx="222" cy="114" r="10" /><circle cx="236" cy="107" r="13" />
    <circle cx="252" cy="114" r="9" /><rect x="212" y="114" width="48" height="11" rx="5.5" />
  </g>
  <g transform="translate(648.12,0)">
    <circle cx="1046" cy="152" r="9" /><circle cx="1059" cy="145" r="12" />
    <circle cx="1074" cy="152" r="8" /><rect x="1037" y="152" width="45" height="10" rx="5" />
  </g>
  <g transform="translate(830.0,0)">
    <circle cx="1336" cy="106" r="8" /><circle cx="1348" cy="100" r="11" />
    <circle cx="1361" cy="106" r="7" /><rect x="1328" y="106" width="40" height="9" rx="4.5" />
  </g>

</g>
</svg>
