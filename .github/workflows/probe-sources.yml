# A one-off diagnostic. Run it by hand, read the log, then delete this file.
#
# WHY IT EXISTS. ReliefWeb answers this repository's laptop with 200 and twenty items and
# answers a GitHub runner with "HTTP 202, 0 bytes, text/html, server: awselb/2.0" on every
# query, through four retries with backoff. That is a deliberate block of datacentre traffic,
# not a transient challenge, so the scheduled job cannot depend on it.
#
# Rather than guess which other sources behave the same way, this probes a list from inside the
# same environment the scheduled job runs in and prints exactly what each one returns. The
# sources that answer become the feed; the ones that do not are recorded with the reason.
name: Probe which sources answer a runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Probe
        run: |
          python - <<'PY'
          import re, time, urllib.error, urllib.request

          UA = ("gccphilanthropy-monitor/0.1 (+https://gccphilanthropy.org; "
                "philanthropy sector monitoring; contact via the site)")

          # Deliberately wide. State news agencies are in here on purpose: they are official,
          # they are per-country, and they are exactly what a page that promises six states and
          # delivers mostly one is missing.
          FEEDS = [
            ("reliefweb rss, plain",      "https://reliefweb.int/updates/rss.xml"),
            ("reliefweb rss, ?search=",   "https://reliefweb.int/updates/rss.xml?search=KSrelief"),
            ("the national ae",           "https://www.thenationalnews.com/arc/outboundfeeds/rss/?outputType=xml"),
            ("saudi gazette",             "https://saudigazette.com.sa/rssFeed/74"),
            ("un ocha",                   "https://www.unocha.org/rss.xml"),
            ("alliance magazine",         "https://www.alliancemagazine.org/feed/"),
            ("arabian business",          "https://www.arabianbusiness.com/feed"),
            ("arab news",                 "https://www.arabnews.com/rss.xml"),
            ("arab news saudi",           "https://www.arabnews.com/taxonomy/term/1/feed"),
            ("gulf news",                 "https://gulfnews.com/rss?generatorName=feed-uae"),
            ("khaleej times",             "https://www.khaleejtimes.com/rss"),
            ("zawya",                     "https://www.zawya.com/en/rss/feed"),
            ("gulf times qatar",          "https://www.gulf-times.com/rssFeed/1"),
            ("peninsula qatar",           "https://thepeninsulaqatar.com/feed"),
            ("qatar tribune",             "https://www.qatar-tribune.com/feed"),
            ("kuwait times",              "https://kuwaittimes.com/feed/"),
            ("arab times kuwait",         "https://www.arabtimesonline.com/news/feed/"),
            ("times of oman",             "https://timesofoman.com/rss"),
            ("muscat daily",              "https://www.muscatdaily.com/feed"),
            ("oman observer",             "https://www.omanobserver.om/feed"),
            ("gulf daily news bahrain",   "https://www.gdnonline.com/rss"),
            ("bahrain news agency",       "https://www.bna.bh/rss.aspx?lang=en"),
            ("emirates news agency wam",  "https://wam.ae/en/rss"),
            ("saudi press agency",        "https://www.spa.gov.sa/rss.xml"),
            ("qatar news agency",         "https://qna.org.qa/en/rss"),
            ("kuna kuwait",               "https://www.kuna.net.kw/RSS.aspx?language=en"),
            ("oman news agency",          "https://omannews.gov.om/rss"),
            ("devex news",                "https://www.devex.com/news/feed"),
            ("philanthropy news digest",  "https://philanthropynewsdigest.org/feeds/rss/news"),
            ("chronicle of philanthropy", "https://www.philanthropy.com/feed"),
            ("un news middle east",       "https://news.un.org/feed/subscribe/en/news/region/middle-east/feed/rss.xml"),
            ("unhcr news",                "https://www.unhcr.org/rss.xml"),
            ("wfp news",                  "https://www.wfp.org/news/rss.xml"),
            ("iom news",                  "https://www.iom.int/rss.xml"),
            ("who emro",                  "https://www.emro.who.int/rss/news.xml"),
            ("google news, gulf giving",  "https://news.google.com/rss/search?q=%22Saudi+Arabia%22+philanthropy&hl=en-GB&gl=GB&ceid=GB:en"),
          ]

          print("%-28s %-6s %-8s %-7s %-22s %s" % ("SOURCE","HTTP","BYTES","ITEMS","SERVER","NOTE"))
          print("-" * 118)
          ok = []
          for name, url in FEEDS:
              code = bytes_ = items = 0
              server = note = ""
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": UA,
                      "Accept": "application/rss+xml,application/xml,text/xml,*/*",
                      "Accept-Language": "en-GB,en;q=0.9",
                      "Accept-Encoding": "identity"})
                  with urllib.request.urlopen(req, timeout=25) as f:
                      code = f.getcode()
                      body = f.read()
                      bytes_ = len(body)
                      server = (f.headers.get("Server") or "")[:22]
                      items = len(re.findall(rb"<item[ >]", body)) or \
                              len(re.findall(rb"<entry[ >]", body))
                      if not bytes_:
                          note = "empty body"
                      elif not items:
                          note = "no items, ct=" + str(f.headers.get("Content-Type"))[:28]
              except urllib.error.HTTPError as e:
                  code = e.code
                  server = (e.headers.get("Server") or "")[:22] if e.headers else ""
                  note = "http error"
              except Exception as e:
                  note = type(e).__name__
              print("%-28s %-6s %-8s %-7s %-22s %s"
                    % (name[:28], code, bytes_, items, server, note[:40]))
              if items:
                  ok.append((name, url, items))
              time.sleep(0.6)

          print()
          print("ANSWERED WITH ITEMS: %d of %d" % (len(ok), len(FEEDS)))
          for n, u, c in ok:
              print("   %-28s %4d items   %s" % (n, c, u))
          PY
